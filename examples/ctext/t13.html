<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colorion Text Effect</title><link rel="stylesheet" href="t13.css"><style>html,body{margin:0;width:100%;height:100%;box-sizing:border-box;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;background:#11121e;color:#f1f1f4}.stage{display:grid;place-items:center;flex:1;min-height:0;overflow:hidden}.stage:not(.running) *, .stage:not(.running) *::before,.stage:not(.running) *::after{animation-play-state:paused!important}.controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px;background:#191c2b;font-size:11px;color:#ddd}.controls button{border:1px solid #636c83;background:#303c5c;color:#fff;border-radius:4px;padding:7px 12px;cursor:pointer}.controls label{display:flex;gap:5px;align-items:center}.controls input{width:28px;height:24px;padding:0;background:none;border:0}</style></head><body><div class="stage" id="stage"><div class="fx-ransom" role="img" aria-label="RANSOM"><b aria-hidden="true" style="--i:0">R</b><b aria-hidden="true" style="--i:1">A</b><b aria-hidden="true" style="--i:2">N</b><b aria-hidden="true" style="--i:3">S</b><b aria-hidden="true" style="--i:4">O</b><b aria-hidden="true" style="--i:5">M</b></div></div><div class="controls"><button id="play" type="button" aria-pressed="false">▶ 재생</button><label>강조색 <input type="color" id="color" value="#ff4fd8"></label></div><script>const s=document.querySelector('#stage'),b=document.querySelector('#play');b.addEventListener('click',()=>{let playing=s.classList.toggle('running');b.textContent=playing?'❚❚ 정지':'▶ 재생';b.setAttribute('aria-pressed',String(playing))});document.querySelector('#color')?.addEventListener('input',e=>document.documentElement.style.setProperty("--ink-2",e.target.value));</script></body></html>
