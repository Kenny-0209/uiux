<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>텍스트·배경 명도 대비</title><link rel="stylesheet" href="../guideui/style.css"></head><body data-lab="color"><div class="lab"><header class="lab-head"><div><span class="kicker">DESIGN BASICS · 09</span><h1>텍스트·배경 명도 대비</h1><p>글자색과 배경색을 바꾸고 대비 비율을 확인합니다.</p></div><a href="https://www.youtube.com/watch?v=TD4wchFyx_Q&t=240s" target="_blank" rel="noopener noreferrer">강의 보기 ↗</a></header><section class="lab-body"><div class="controls"><h2>색상 조절</h2><label><span>글자색 <output id="fg-out"></output></span><input type="color" id="fg" value="#24352b"></label><label><span>배경색 <output id="bg-out"></output></span><input type="color" id="bg" value="#f5f7f1"></label><p class="hint">색상 외에도 문구와 아이콘으로 상태를 전달할 수 있습니다.</p></div><div class="stage"><h2>같은 정보, 다른 색</h2><div class="ratio-box"><strong>결과를 확인하세요</strong><span>선택한 항목의 세부 정보를 볼 수 있습니다.</span></div><div class="ratio"><strong id="ratio-out"></strong> · <span id="ratio-guide"></span></div><p class="hint">4.5:1은 일반 텍스트 대비를 살펴보는 기준입니다. 큰 글자와 예외, 다른 요소는 별도 기준을 확인하세요. <a href="https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html" target="_blank" rel="noopener noreferrer">W3C 기준 ↗</a></p></div></section><p class="footer">공개 강좌를 참고한 자체 실습 · 영상 원본은 강의 보기에서 확인할 수 있습니다.</p></div><script src="../guideui/lab.js"></script></body></html>
