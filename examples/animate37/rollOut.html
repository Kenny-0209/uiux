<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animate.css Demo</title><link rel="stylesheet" href="animate.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#eff3ee;color:#233027;font-family:Arial,sans-serif;display:flex;flex-direction:column}.stage{display:grid;place-items:center;flex:1;overflow:hidden;perspective:800px}.target{width:min(210px,75%);padding:18px 20px;background:#fff;border:1px solid #ccd9ca;border-radius:8px;box-shadow:0 8px 22px #22372218}.target small{color:#6b8770;font-size:10px;letter-spacing:.14em}.target strong{display:block;margin-top:7px;font-size:20px}.target span{font-size:11px;color:#667369}.controls{display:flex;gap:8px;justify-content:center;align-items:center;background:#e4ece1;padding:10px}.controls button{border:1px solid #79947f;border-radius:4px;background:#233f2c;color:#fff;padding:8px 13px;cursor:pointer;font-size:12px}.controls code{color:#526858;font-size:11px}</style></head><body><div class="stage"><article id="target" class="target"><small>ANIMATE.CSS</small><strong>New message</strong><span>Motion preview</span></article></div><div class="controls"><button type="button" id="play">▶ 재생</button><code>rollOut</code></div><script>const el=document.querySelector('#target');document.querySelector('#play').addEventListener('click',()=>{el.className='target';void el.offsetWidth;el.classList.add('animated',"rollOut")});</script></body></html>
