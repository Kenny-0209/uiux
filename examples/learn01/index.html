<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>그리드 열·간격·여백</title><link rel="stylesheet" href="../guideui/style.css"></head><body data-lab="grid"><div class="lab"><header class="lab-head"><div><span class="kicker">DESIGN BASICS · 08</span><h1>그리드 열·간격·여백</h1><p>열 수와 간격을 바꿔 같은 카드의 폭과 정보량을 비교합니다.</p></div><a href="https://www.youtube.com/watch?v=4aF_IQJeFpg&t=120s" target="_blank" rel="noopener noreferrer">강의 보기 ↗</a></header><section class="lab-body"><div class="controls"><h2>배치 조절</h2><label><span>열 수 <output id="cols-out"></output></span><input id="cols" type="range" min="1" max="3" value="2" step="1"></label><label><span>열 사이 간격 <output id="gap-out"></output></span><input id="gap" type="range" min="0" max="32" value="12"></label><label><span>바깥 여백 <output id="margin-out"></output></span><input id="margin" type="range" min="0" max="32" value="12"></label><p class="hint">열이 많아지면 한 항목에 쓸 수 있는 너비가 줄어듭니다.</p></div><div class="stage"><h2 id="grid-note">카드 배치</h2><div class="preview sample-grid"><article class="sample-card"><div class="visual"></div><strong>계획 보기</strong><small>주요 정보를 확인합니다.</small></article><article class="sample-card"><div class="visual"></div><strong>결과 비교</strong><small>두 결과를 나란히 봅니다.</small></article><article class="sample-card"><div class="visual"></div><strong>상세 설정</strong><small>필요한 조건을 조절합니다.</small></article></div></div></section><p class="footer">공개 강좌를 참고한 자체 실습 · 영상 원본은 강의 보기에서 확인할 수 있습니다.</p></div><script src="../guideui/lab.js"></script></body></html>
