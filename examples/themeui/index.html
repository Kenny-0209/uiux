<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원본 밝기 테마 비교</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0;font:12px system-ui,sans-serif;background:#101813;color:#e5efe7}.bar{height:42px;display:flex;align-items:center;gap:7px;padding:5px 10px;border-bottom:1px solid #35463a}.bar span{margin-right:auto;color:#adc2b1}.bar button{border:1px solid #526b5a;background:#18271d;color:#e8f2e9;border-radius:3px;padding:5px 9px;cursor:pointer}.bar button[aria-pressed=true]{background:#d4ebd9;color:#18271d}iframe{display:block;width:100%;height:calc(100% - 42px);border:0;background:white}</style></head>
<body><div class="bar"><span>원본 화면 테마</span><button type="button" data-theme="light" aria-pressed="true">밝게</button><button type="button" data-theme="dark" aria-pressed="false">어둡게</button></div><iframe id="sample" title="원본 화면 미리보기"></iframe>
<script>const allow=new Set(['ai025','ai028','ai029']);const demo=new URLSearchParams(location.search).get('demo');const frame=document.querySelector('#sample');function setTheme(theme){if(!allow.has(demo))return;frame.src='../'+demo+'/index.html?theme='+theme;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)))}document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme)));setTheme('light');</script></body></html>
