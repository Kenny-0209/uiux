<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>좁은 화면의 텍스트 처리</title><link rel="stylesheet" href="../guideui/style.css"></head><body data-lab="shrink"><div class="lab"><header class="lab-head"><div><span class="kicker">DESIGN BASICS · 30</span><h1>좁은 화면의 텍스트 처리</h1><p>사용 가능한 너비와 최소 크기를 바꾸며 축소·줄바꿈·생략을 비교합니다.</p></div><a href="https://www.youtube.com/watch?v=JIHf1lVjh_w&t=120s" target="_blank" rel="noopener noreferrer">강의 보기 ↗</a></header><section class="lab-body"><div class="controls"><h2>레이블 조절</h2><label>표시 문구<input id="label-text" type="text" maxlength="70" value="오늘의 디자인 실험 결과 확인"></label><label>표시 방식<select id="mode"><option value="shrink">한 줄 자동 축소</option><option value="wrap">줄바꿈</option><option value="clip">한 줄 생략</option></select></label><label><span>최대 너비 <output id="width-out"></output></span><input id="label-width" type="range" min="120" max="380" value="220"></label><label><span>최소 글자 크기 <output id="min-out"></output></span><input id="min-size" type="range" min="10" max="24" value="14"></label></div><div class="stage"><h2>레이블 미리보기</h2><div class="preview autosize-stage"><div class="clip-label"></div><p class="status" id="shrink-out" aria-live="polite"></p><p class="hint">이 실습은 개념 모형입니다. 실제 iOS 구현에서는 Dynamic Type과 공식 API를 함께 검토합니다.</p></div></div></section><p class="footer">공개 강좌를 참고한 자체 실습 · 영상 원본은 강의 보기에서 확인할 수 있습니다.</p></div><script src="../guideui/lab.js"></script></body></html>
