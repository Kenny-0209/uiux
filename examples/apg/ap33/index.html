<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/switch-checkbox.css">
<style>html{background:#fff;color:#17201b}body{font-family:Arial,sans-serif;margin:0;padding:24px;box-sizing:border-box}*,*:before,*:after{box-sizing:border-box}button,input,select{font:inherit}.menu-button-actions [role="separator"]{background-image:none;border-top:1px solid currentColor}</style>
</head><body>

        <div id="ex1">
          <fieldset>
            <legend>Accessibility Preferences</legend>
            <label>
              <span class="label">Reduced motion</span>
              <input id="id-switch-1" type="checkbox" role="switch">
              <span class="state">
                <span class="container">
                  <span class="position"> </span>
                </span>
                <span class="on" aria-hidden="true">On</span>
                <span class="off" aria-hidden="true">Off</span>
              </span>
            </label>

            <label>
              <span class="label">Show captions</span>
              <input id="id-switch-2" type="checkbox" role="switch">
              <span class="state">
                <span class="container">
                  <span class="position"> </span>
                </span>
                <span class="on" aria-hidden="true">On</span>
                <span class="off" aria-hidden="true">Off</span>
              </span>
            </label>
          </fieldset>
        </div>
        
<script src="js/switch-checkbox.js"></script>
</body></html>
