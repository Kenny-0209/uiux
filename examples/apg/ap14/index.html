<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/alert.css">
<style>html{background:#fff;color:#17201b}body{font-family:Arial,sans-serif;margin:0;padding:24px;box-sizing:border-box}*,*:before,*:after{box-sizing:border-box}button,input,select{font:inherit}.menu-button-actions [role="separator"]{background-image:none;border-top:1px solid currentColor}</style>
</head><body>

        <div id="ex1">
          <button type="button" id="alert-trigger">Trigger Alert</button>

          <div id="example" role="alert"></div>

          <!--  The following script element contains the content that will be inserted into the alert element. -->
          <script type="text/template" id="alert-template">
            <p>Hello</p>
          </script>
        </div>
        
<script src="js/alert.js"></script>
</body></html>
