<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/checkbox-mixed.css">
<style>html{background:#fff;color:#17201b}body{font-family:Arial,sans-serif;margin:0;padding:24px;box-sizing:border-box}*,*:before,*:after{box-sizing:border-box}button,input,select{font:inherit}.menu-button-actions [role="separator"]{background-image:none;border-top:1px solid currentColor}</style>
</head><body>

        <div id="ex1">
          <fieldset class="checkbox-mixed">
            <legend>Sandwich Condiments</legend>
            <div role="checkbox" class="group_checkbox" aria-checked="mixed" aria-controls="cond1 cond2 cond3 cond4" tabindex="0">All condiments</div>
            <ul class="checkboxes">
              <li>
                <label><input type="checkbox" id="cond1">Lettuce</label>
              </li>
              <li>
                <label><input type="checkbox" id="cond2" checked>Tomato</label>
              </li>
              <li>
                <label><input type="checkbox" id="cond3">Mustard</label>
              </li>
              <li>
                <label><input type="checkbox" id="cond4">Sprouts</label>
              </li>
            </ul>
          </fieldset>
        </div>
        
<script src="js/checkbox-mixed.js"></script>
</body></html>
