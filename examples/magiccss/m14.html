<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic CSS Demo</title><link rel="stylesheet" href="magic.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#20212d;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column}.stage{display:grid;place-items:center;flex:1;overflow:hidden;perspective:800px}.box{display:grid;place-items:center;width:80px;height:80px;border-radius:9px;background:#fc297f;box-shadow:0 0 20px -6px #fc297f}.box img{width:34px;height:34px;filter:brightness(0) invert(1)}.controls{display:flex;gap:8px;justify-content:center;align-items:center;background:#151824;padding:10px}.controls button{border:1px solid #744469;border-radius:4px;background:#31273d;color:#fff;padding:8px 13px;cursor:pointer;font-size:12px}.controls code{color:#a7adbe;font-size:11px}</style></head><body><div class="stage"><div id="magic" class="box"><img src="rocket.svg" alt=""></div></div><div class="controls"><button type="button" id="play">▶ 재생</button><code>boingInUp</code></div><script>const el=document.querySelector('#magic');document.querySelector('#play').addEventListener('click',()=>{el.className='box';void el.offsetWidth;el.classList.add('magictime',"boingInUp")});</script></body></html>
