<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-label="Illustration of an athlete lifting a barbell overhead">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c6ff3d"/><stop offset="1" stop-color="#3dffb0"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a62"/><stop offset="1" stop-color="#a86a45"/></linearGradient>
    <linearGradient id="kit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d2e"/><stop offset="1" stop-color="#ff2e63"/></linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity=".14"/></pattern>
  </defs>
  <circle cx="280" cy="330" r="250" fill="url(#dots)"/>
  <circle cx="280" cy="330" r="200" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round"/>
  <circle cx="280" cy="330" r="170" fill="#16181e"/>
  <path d="M120 470 L440 470" stroke="#c6ff3d" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  <!-- barbell -->
  <rect x="40" y="96" width="480" height="10" rx="5" fill="#d7dbe3"/>
  <g fill="#0c0d10" stroke="#c6ff3d" stroke-width="3">
    <rect x="58" y="56" width="26" height="90" rx="6"/><rect x="88" y="66" width="18" height="70" rx="5"/>
    <rect x="476" y="56" width="26" height="90" rx="6"/><rect x="454" y="66" width="18" height="70" rx="5"/>
  </g>
  <!-- arms -->
  <path d="M232 250 L200 170 L192 104" fill="none" stroke="url(#skin)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M328 250 L360 170 L368 104" fill="none" stroke="url(#skin)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="192" cy="101" r="17" fill="#a86a45"/><circle cx="368" cy="101" r="17" fill="#a86a45"/>
  <!-- legs -->
  <path d="M250 400 L222 470 L214 560" fill="none" stroke="#23262e" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M310 400 L338 470 L346 560" fill="none" stroke="#23262e" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M234 470 L218 470" stroke="#c6ff3d" stroke-width="6"/><path d="M326 470 L342 470" stroke="#c6ff3d" stroke-width="6"/>
  <path d="M186 575 h48 a10 10 0 0 0 0-20 h-30 z" fill="#f4f5f7"/><path d="M374 575 h-48 a10 10 0 0 1 0-20 h30 z" fill="#f4f5f7"/>
  <!-- torso -->
  <path d="M222 240 Q280 222 338 240 L330 330 Q280 342 230 330 Z" fill="url(#kit)"/>
  <path d="M230 330 Q280 342 330 330 L336 410 Q280 425 224 410 Z" fill="#23262e"/>
  <path d="M232 332 Q280 346 328 332" stroke="#c6ff3d" stroke-width="5" fill="none"/>
  <!-- neck & head -->
  <rect x="266" y="200" width="28" height="34" rx="10" fill="#a86a45"/>
  <ellipse cx="280" cy="180" rx="34" ry="38" fill="url(#skin)"/>
  <path d="M246 172 C246 138 314 132 316 170 C304 158 288 156 270 160 C258 162 252 168 246 172Z" fill="#1a1512"/>
  <path d="M252 158 Q280 146 310 158" stroke="#ff4d2e" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="268" cy="184" r="3" fill="#1a1512"/><circle cx="292" cy="184" r="3" fill="#1a1512"/>
  <path d="M270 200 Q280 206 290 200" stroke="#6e3d24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- motion marks -->
  <g stroke="#c6ff3d" stroke-width="5" stroke-linecap="round"><path d="M150 60 l-20 -18"/><path d="M410 60 l20 -18"/><path d="M140 96 h-26"/><path d="M420 96 h26"/></g>
</svg>
