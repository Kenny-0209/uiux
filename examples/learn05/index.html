<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>dp와 화면 밀도</title><link rel="stylesheet" href="../guideui/style.css"></head><body data-lab="density"><div class="lab"><header class="lab-head"><div><span class="kicker">DESIGN BASICS · 18</span><h1>dp와 화면 밀도</h1><p>논리 크기와 화면 밀도를 조절해 픽셀 환산값을 비교합니다.</p></div><a href="https://www.youtube.com/watch?v=0TGVFr10mL0&t=150s" target="_blank" rel="noopener noreferrer">강의 보기 ↗</a></header><section class="lab-body"><div class="controls"><h2>단위 조절</h2><label><span>논리 크기 <output id="dp-out"></output></span><input id="dp" type="range" min="8" max="160" value="48"></label><label><span>화면 밀도 <output id="dpi-out"></output></span><input id="dpi" type="range" min="120" max="640" step="40" value="160"></label><p class="hint">dp를 화면 픽셀로 환산한 개념 예시입니다.</p></div><div class="stage"><h2>픽셀 환산</h2><div class="preview pixel-stage"><span>dp × dpi ÷ 160</span><strong class="value" id="pixel-out"></strong><div class="pixel-visual"></div><p class="hint">막대는 비율을 시각화한 것으로 실제 기기의 물리 크기 재현은 아닙니다. sp 글자 확대는 이 계산에 포함되지 않습니다. <a href="https://developer.android.com/training/multiscreen/screendensities" target="_blank" rel="noopener noreferrer">Android 문서 ↗</a></p></div></div></section><p class="footer">공개 강좌를 참고한 자체 실습 · 영상 원본은 강의 보기에서 확인할 수 있습니다.</p></div><script src="../guideui/lab.js"></script></body></html>
