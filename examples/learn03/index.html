<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>아이콘 크기와 선 굵기</title><link rel="stylesheet" href="../guideui/style.css"></head><body data-lab="icon"><div class="lab"><header class="lab-head"><div><span class="kicker">DESIGN BASICS · 10</span><h1>아이콘 크기와 선 굵기</h1><p>같은 아이콘의 형태와 선 두께를 조절해 작은 크기에서 비교합니다.</p></div><a href="https://www.youtube.com/watch?v=LGB-XI8aGVg&t=100s" target="_blank" rel="noopener noreferrer">강의 보기 ↗</a></header><section class="lab-body"><div class="controls"><h2>아이콘 조절</h2><label>아이콘<select id="icon"><option value="heart">좋아요</option><option value="search">검색</option><option value="bookmark">저장</option></select></label><label>표현<select id="fill"><option value="outline">윤곽선</option><option value="filled">채움</option></select></label><label><span>아이콘 크기 <output id="size-out"></output></span><input id="size" type="range" min="16" max="56" value="32"></label><label><span>선 두께 <output id="stroke-out"></output></span><input id="stroke" type="range" min="1" max="4" step="0.5" value="2"></label><p class="hint">보이는 그림의 크기와 실제 터치 영역은 서로 다릅니다.</p></div><div class="stage"><h2>같은 크기의 작업 영역</h2><div class="preview icon-stage"><div class="icon-demo"><svg viewBox="0 0 24 24" aria-label="선택한 아이콘" role="img"><path id="icon-path"></path></svg></div><div><strong>저장</strong><p class="hint">아이콘과 글자를 함께<br>확인합니다.</p></div></div></div></section><p class="footer">공개 강좌를 참고한 자체 실습 · 영상 원본은 강의 보기에서 확인할 수 있습니다.</p></div><script src="../guideui/lab.js"></script></body></html>
