<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>글자 크기와 줄 간격</title><link rel="stylesheet" href="../guideui/style.css"></head><body data-lab="type"><div class="lab"><header class="lab-head"><div><span class="kicker">DESIGN BASICS · 11</span><h1>글자 크기와 줄 간격</h1><p>제목·본문의 크기와 행간을 바꾸어 위계와 읽기 흐름을 비교합니다.</p></div><a href="https://www.youtube.com/watch?v=iKaK2sAkKW8&t=120s" target="_blank" rel="noopener noreferrer">강의 보기 ↗</a></header><section class="lab-body"><div class="controls"><h2>텍스트 조절</h2><label><span>제목 크기 <output id="title-out"></output></span><input id="title-size" type="range" min="16" max="40" value="24"></label><label><span>본문 크기 <output id="body-out"></output></span><input id="body-size" type="range" min="11" max="24" value="15"></label><label><span>줄 간격 <output id="leading-out"></output></span><input id="leading" type="range" min="1" max="2.2" value="1.5" step="0.1"></label><label><span>본문 너비 <output id="measure-out"></output></span><input id="measure" type="range" min="150" max="500" value="420"></label></div><div class="stage"><h2>동일한 콘텐츠</h2><div class="preview text-sample"><p class="sample-title">결과를 살펴보세요</p><p class="sample-copy">중요한 정보가 먼저 보이도록 제목과 본문의 차이를 조정합니다. 글자 크기와 줄 간격, 한 줄의 길이가 바뀌면 같은 문장도 다르게 읽힙니다.</p></div></div></section><p class="footer">공개 강좌를 참고한 자체 실습 · 영상 원본은 강의 보기에서 확인할 수 있습니다.</p></div><script src="../guideui/lab.js"></script></body></html>
