<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codrops Button Hover Styles</title><link rel="stylesheet" href="css/interactive.css"><style>html,body{margin:0;width:100%;height:100%;min-height:0}body{display:grid;place-items:center;background:#f7f7f4;font-family:Arial,sans-serif}.demo{display:grid;place-items:center;gap:16px}small{font:12px Arial;color:#52605a}.button{margin:0}</style></head><body><div class="demo"><button class="button button--mimas"><span>Render</span></button><small>마우스를 올리거나 눌러 효과를 확인하세요</small></div><script>document.querySelector('.button').addEventListener('click',e=>e.currentTarget.classList.toggle('force-hover'));</script></body></html>
