<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count input</title><link rel="stylesheet" href="input-count.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-count" data-max="40">
  <div class="field-count__box">
    <input class="field-count__input" type="text" maxlength="40" placeholder="Write something…" aria-label="Your text">
  </div>
  <div class="field-count__meter" aria-hidden="true">
    <span class="field-count__track"><span class="field-count__bar"></span></span>
    <span class="field-count__count">0/40</span>
  </div>
</div>
<script src="input-count.js"></script></body></html>
