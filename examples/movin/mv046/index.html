<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe to Confirm button</title><link rel="stylesheet" href="button-swipe-confirm.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="btn-swipe-confirm">
  <span class="btn-swipe-confirm__fill" aria-hidden="true"></span>
  <span class="btn-swipe-confirm__hint" aria-hidden="true">Slide to confirm</span>
  <span class="btn-swipe-confirm__done" aria-hidden="true">Confirmed</span>
  <button class="btn-swipe-confirm__knob" type="button" aria-label="Confirm">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="btn-swipe-confirm__arrow" d="M5 12h13m-5-5 5 5-5 5" />
      <path class="btn-swipe-confirm__check" d="m6 12.5 4 4 8-9" />
    </svg>
  </button>
</div>
<script src="button-swipe-confirm.js"></script></body></html>
