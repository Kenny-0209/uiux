<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blinds toggle</title><link rel="stylesheet" href="toggle-blinds.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-blinds">
  <input class="toggle-blinds__input" type="checkbox" role="switch">
  <span class="toggle-blinds__room" aria-hidden="true">
    <span class="toggle-blinds__window">
      <span class="toggle-blinds__slat" style="--i: 0"></span>
      <span class="toggle-blinds__slat" style="--i: 1"></span>
      <span class="toggle-blinds__slat" style="--i: 2"></span>
      <span class="toggle-blinds__slat" style="--i: 3"></span>
      <span class="toggle-blinds__slat" style="--i: 4"></span>
      <span class="toggle-blinds__slat" style="--i: 5"></span>
      <span class="toggle-blinds__slat" style="--i: 6"></span>
      <span class="toggle-blinds__slat" style="--i: 7"></span>
    </span>
    <span class="toggle-blinds__spill"></span>
  </span>
  <span class="toggle-blinds__label">Blinds</span>
</label>
</body></html>
