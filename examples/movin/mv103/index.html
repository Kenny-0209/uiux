<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Fill checkbox</title><link rel="stylesheet" href="checkbox-pixel-fill.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-pixel-fill">
  <input class="cb-pixel-fill__input" type="checkbox" aria-label="Remember me">
  <span class="cb-pixel-fill__box" aria-hidden="true">
    <span style="--cb-pixel-fill-i: 7"></span><span style="--cb-pixel-fill-i: 2"></span><span style="--cb-pixel-fill-i: 12"></span><span style="--cb-pixel-fill-i: 0"></span>
    <span style="--cb-pixel-fill-i: 9"></span><span style="--cb-pixel-fill-i: 14"></span><span style="--cb-pixel-fill-i: 4"></span><span style="--cb-pixel-fill-i: 11"></span>
    <span style="--cb-pixel-fill-i: 1"></span><span style="--cb-pixel-fill-i: 15"></span><span style="--cb-pixel-fill-i: 6"></span><span style="--cb-pixel-fill-i: 10"></span>
    <span style="--cb-pixel-fill-i: 3"></span><span style="--cb-pixel-fill-i: 13"></span><span style="--cb-pixel-fill-i: 5"></span><span style="--cb-pixel-fill-i: 8"></span>
  </span>
</label>
</body></html>
