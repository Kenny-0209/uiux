<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED radio button</title><link rel="stylesheet" href="radio-led.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-led" role="radiogroup" aria-label="Level">
  <label class="radio-led__option">
    <input class="radio-led__input" type="radio" name="radio-led" value="Low">
    <span class="radio-led__lamp"><span class="radio-led__core"></span></span>
    <span class="radio-led__label">Low</span>
  </label>
  <label class="radio-led__option">
    <input class="radio-led__input" type="radio" name="radio-led" value="Mid">
    <span class="radio-led__lamp"><span class="radio-led__core"></span></span>
    <span class="radio-led__label">Mid</span>
  </label>
  <label class="radio-led__option">
    <input class="radio-led__input" type="radio" name="radio-led" value="High">
    <span class="radio-led__lamp"><span class="radio-led__core"></span></span>
    <span class="radio-led__label">High</span>
  </label>
</div>
</body></html>
