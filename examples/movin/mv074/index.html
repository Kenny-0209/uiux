<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe Deck card</title><link rel="stylesheet" href="card-swipe-deck.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-swipe-deck" tabindex="0" role="group" aria-label="Card deck. Drag the top card, or use the left and right arrow keys.">
  <div class="card-swipe-deck__card">
    <span class="card-swipe-deck__num">01</span>
    <span class="card-swipe-deck__title">Swiss grid</span>
    <span class="card-swipe-deck__text">Drag me sideways</span>
    <span class="card-swipe-deck__stamp card-swipe-deck__stamp--keep" aria-hidden="true">Keep</span>
    <span class="card-swipe-deck__stamp card-swipe-deck__stamp--skip" aria-hidden="true">Skip</span>
  </div>
  <div class="card-swipe-deck__card">
    <span class="card-swipe-deck__num">02</span>
    <span class="card-swipe-deck__title">Bauhaus</span>
    <span class="card-swipe-deck__text">Form follows function</span>
    <span class="card-swipe-deck__stamp card-swipe-deck__stamp--keep" aria-hidden="true">Keep</span>
    <span class="card-swipe-deck__stamp card-swipe-deck__stamp--skip" aria-hidden="true">Skip</span>
  </div>
  <div class="card-swipe-deck__card">
    <span class="card-swipe-deck__num">03</span>
    <span class="card-swipe-deck__title">Brutalism</span>
    <span class="card-swipe-deck__text">Raw and honest</span>
    <span class="card-swipe-deck__stamp card-swipe-deck__stamp--keep" aria-hidden="true">Keep</span>
    <span class="card-swipe-deck__stamp card-swipe-deck__stamp--skip" aria-hidden="true">Skip</span>
  </div>
  <div class="card-swipe-deck__card">
    <span class="card-swipe-deck__num">04</span>
    <span class="card-swipe-deck__title">Memphis</span>
    <span class="card-swipe-deck__text">Loud on purpose</span>
    <span class="card-swipe-deck__stamp card-swipe-deck__stamp--keep" aria-hidden="true">Keep</span>
    <span class="card-swipe-deck__stamp card-swipe-deck__stamp--skip" aria-hidden="true">Skip</span>
  </div>
</div>
<script src="card-swipe-deck.js"></script></body></html>
