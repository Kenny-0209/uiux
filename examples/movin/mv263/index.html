<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull Cord toggle</title><link rel="stylesheet" href="toggle-cord.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-cord">
  <input class="toggle-cord__input" type="checkbox" role="switch">
  <span class="toggle-cord__lamp" aria-hidden="true">
    <span class="toggle-cord__cone"></span>
    <span class="toggle-cord__chain"></span>
    <span class="toggle-cord__wire"></span>
    <span class="toggle-cord__bulb"></span>
    <span class="toggle-cord__shade"></span>
  </span>
  <span class="toggle-cord__label">Lamp</span>
</label>
<script src="toggle-cord.js"></script></body></html>
