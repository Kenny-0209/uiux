<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD Brackets input</title><link rel="stylesheet" href="input-hud-brackets.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-hud-brackets">
  <span class="field-hud-brackets__bracket field-hud-brackets__bracket--tl" aria-hidden="true"></span>
  <span class="field-hud-brackets__bracket field-hud-brackets__bracket--tr" aria-hidden="true"></span>
  <span class="field-hud-brackets__bracket field-hud-brackets__bracket--bl" aria-hidden="true"></span>
  <span class="field-hud-brackets__bracket field-hud-brackets__bracket--br" aria-hidden="true"></span>
  <input class="field-hud-brackets__input" type="text" placeholder="Targeting…" aria-label="Target">
</div>
</body></html>
