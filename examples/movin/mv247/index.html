<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp radio button</title><link rel="stylesheet" href="radio-stamp.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-stamp" role="radiogroup" aria-label="Status">
  <label class="radio-stamp__option">
    <input class="radio-stamp__input" type="radio" name="radio-stamp" value="Draft">
    <span class="radio-stamp__ring"><span class="radio-stamp__dot"></span></span>
    <span class="radio-stamp__label">Draft</span>
  </label>
  <label class="radio-stamp__option">
    <input class="radio-stamp__input" type="radio" name="radio-stamp" value="Approved">
    <span class="radio-stamp__ring"><span class="radio-stamp__dot"></span></span>
    <span class="radio-stamp__label">Approved</span>
  </label>
  <label class="radio-stamp__option">
    <input class="radio-stamp__input" type="radio" name="radio-stamp" value="Rejected">
    <span class="radio-stamp__ring"><span class="radio-stamp__dot"></span></span>
    <span class="radio-stamp__label">Rejected</span>
  </label>
</div>
</body></html>
