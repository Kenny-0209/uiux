<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmented toggle</title><link rel="stylesheet" href="toggle-segmented.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="toggle-segmented" role="group" aria-label="Toggle">
  <span class="toggle-segmented__pill" aria-hidden="true"></span>
  <button class="toggle-segmented__option" type="button" aria-pressed="true">Off</button>
  <button class="toggle-segmented__option" type="button" aria-pressed="false">On</button>
</div>
<script src="toggle-segmented.js"></script></body></html>
