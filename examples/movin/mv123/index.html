<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>X to Check checkbox</title><link rel="stylesheet" href="checkbox-x-to-check.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-x-to-check">
  <input class="cb-x-to-check__input" type="checkbox" aria-label="Remember me">
  <span class="cb-x-to-check__box" aria-hidden="true">
    <svg class="cb-x-to-check__x" width="11" height="11" viewBox="0 0 11 11" fill="none">
      <line x1="1" y1="1" x2="10" y2="10" stroke="light-dark(rgba(55, 58, 64, 0.6), rgba(241, 242, 243, 0.6))" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="1" x2="1" y2="10" stroke="light-dark(rgba(55, 58, 64, 0.6), rgba(241, 242, 243, 0.6))" stroke-width="2" stroke-linecap="round" />
    </svg>
    <svg class="cb-x-to-check__check" width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1.5 5L5 8.5L11.5 1.5" stroke="light-dark(#373a40, #f1f2f3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
  </span>
</label>
</body></html>
