<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fan radio button</title><link rel="stylesheet" href="radio-fan.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-fan" role="radiogroup" aria-label="Pick a card">
  <label class="radio-fan__option" style="--radio-fan-i: 0">
    <input class="radio-fan__input" type="radio" name="radio-fan" value="A♠" aria-label="Ace of spades">
    <span class="radio-fan__card" aria-hidden="true"><span class="radio-fan__rank">A</span><span class="radio-fan__suit">♠</span></span>
  </label>
  <label class="radio-fan__option" style="--radio-fan-i: 1">
    <input class="radio-fan__input" type="radio" name="radio-fan" value="K♥" aria-label="King of hearts" checked>
    <span class="radio-fan__card" aria-hidden="true"><span class="radio-fan__rank">K</span><span class="radio-fan__suit">♥</span></span>
  </label>
  <label class="radio-fan__option" style="--radio-fan-i: 2">
    <input class="radio-fan__input" type="radio" name="radio-fan" value="Q♦" aria-label="Queen of diamonds">
    <span class="radio-fan__card" aria-hidden="true"><span class="radio-fan__rank">Q</span><span class="radio-fan__suit">♦</span></span>
  </label>
  <label class="radio-fan__option" style="--radio-fan-i: 3">
    <input class="radio-fan__input" type="radio" name="radio-fan" value="J♣" aria-label="Jack of clubs">
    <span class="radio-fan__card" aria-hidden="true"><span class="radio-fan__rank">J</span><span class="radio-fan__suit">♣</span></span>
  </label>
</div>
</body></html>
