<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blob radio button</title><link rel="stylesheet" href="radio-blob.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-blob" role="radiogroup" aria-label="Consistency">
  <span class="radio-blob__pill" aria-hidden="true"></span>
  <label class="radio-blob__option">
    <input class="radio-blob__input" type="radio" name="radio-blob" value="Liquid" checked>
    <span class="radio-blob__dot"></span>
    <span class="radio-blob__label">Liquid</span>
  </label>
  <label class="radio-blob__option">
    <input class="radio-blob__input" type="radio" name="radio-blob" value="Fluid">
    <span class="radio-blob__dot"></span>
    <span class="radio-blob__label">Fluid</span>
  </label>
  <label class="radio-blob__option">
    <input class="radio-blob__input" type="radio" name="radio-blob" value="Viscous">
    <span class="radio-blob__dot"></span>
    <span class="radio-blob__label">Viscous</span>
  </label>
</div>
<script src="radio-blob.js"></script></body></html>
