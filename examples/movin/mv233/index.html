<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Trace radio button</title><link rel="stylesheet" href="radio-neon-trace.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-neon-trace" role="radiogroup" aria-label="Star">
  <label class="radio-neon-trace__option">
    <input class="radio-neon-trace__input" type="radio" name="radio-neon-trace" value="Hyperion" checked>
    <svg class="radio-neon-trace__trace" width="220" height="48"><rect x="0.75" y="0.75" width="218.5" height="46.5" rx="7" ry="7" /></svg>
    <span class="radio-neon-trace__ring"><span class="radio-neon-trace__dot"></span></span>
    <span class="radio-neon-trace__label">Hyperion</span>
  </label>
  <label class="radio-neon-trace__option">
    <input class="radio-neon-trace__input" type="radio" name="radio-neon-trace" value="Solaris">
    <svg class="radio-neon-trace__trace" width="220" height="48"><rect x="0.75" y="0.75" width="218.5" height="46.5" rx="7" ry="7" /></svg>
    <span class="radio-neon-trace__ring"><span class="radio-neon-trace__dot"></span></span>
    <span class="radio-neon-trace__label">Solaris</span>
  </label>
  <label class="radio-neon-trace__option">
    <input class="radio-neon-trace__input" type="radio" name="radio-neon-trace" value="Quantum">
    <svg class="radio-neon-trace__trace" width="220" height="48"><rect x="0.75" y="0.75" width="218.5" height="46.5" rx="7" ry="7" /></svg>
    <span class="radio-neon-trace__ring"><span class="radio-neon-trace__dot"></span></span>
    <span class="radio-neon-trace__label">Quantum</span>
  </label>
</div>
</body></html>
