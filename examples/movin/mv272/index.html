<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon toggle</title><link rel="stylesheet" href="toggle-icon.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><button class="toggle-icon" type="button" role="switch" aria-checked="false" aria-label="Switch to light mode">
  <span class="toggle-icon__knob">
    <svg class="toggle-icon__sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="light-dark(#5f626a, #a7abb2)" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <line x1="12" y1="2" x2="12" y2="5" />
      <line x1="12" y1="19" x2="12" y2="22" />
      <line x1="2" y1="12" x2="5" y2="12" />
      <line x1="19" y1="12" x2="22" y2="12" />
      <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" />
      <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" />
      <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" />
      <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" />
    </svg>
    <svg class="toggle-icon__moon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="light-dark(rgba(80, 83, 91, 0.85), rgba(198, 200, 205, 0.85))" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
    </svg>
  </span>
</button>
<script src="toggle-icon.js"></script></body></html>
