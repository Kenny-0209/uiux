<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Sign toggle</title><link rel="stylesheet" href="toggle-neon-sign.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-neon-sign">
  <input class="toggle-neon-sign__input" type="checkbox" role="switch" aria-label="Open sign">
  <span class="toggle-neon-sign__board" aria-hidden="true">
    <span class="toggle-neon-sign__word"><span>O</span><span>P</span><span class="toggle-neon-sign__weak">E</span><span>N</span></span>
  </span>
</label>
</body></html>
