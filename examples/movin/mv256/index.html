<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airplane toggle</title><link rel="stylesheet" href="toggle-airplane.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-airplane">
  <input class="toggle-airplane__input" type="checkbox" role="switch">
  <span class="toggle-airplane__track" aria-hidden="true">
    <span class="toggle-airplane__trail"></span>
    <span class="toggle-airplane__thumb">
      <svg viewBox="0 0 24 24"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5Z" /></svg>
    </span>
  </span>
  <span class="toggle-airplane__label">Airplane mode</span>
</label>
</body></html>
