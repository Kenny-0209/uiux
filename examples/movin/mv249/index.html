<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Bar radio button</title><link rel="stylesheet" href="radio-tab-bar.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-tab-bar" role="radiogroup" aria-label="Section">
  <label class="radio-tab-bar__option">
    <input class="radio-tab-bar__input" type="radio" name="radio-tab-bar" value="home" checked>
    <span class="radio-tab-bar__tab">
      <svg class="radio-tab-bar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4Z" /></svg>
      <span class="radio-tab-bar__label"><span>Home</span></span>
    </span>
  </label>
  <label class="radio-tab-bar__option">
    <input class="radio-tab-bar__input" type="radio" name="radio-tab-bar" value="search">
    <span class="radio-tab-bar__tab">
      <svg class="radio-tab-bar__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" /></svg>
      <span class="radio-tab-bar__label"><span>Search</span></span>
    </span>
  </label>
  <label class="radio-tab-bar__option">
    <input class="radio-tab-bar__input" type="radio" name="radio-tab-bar" value="saved">
    <span class="radio-tab-bar__tab">
      <svg class="radio-tab-bar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z" /></svg>
      <span class="radio-tab-bar__label"><span>Saved</span></span>
    </span>
  </label>
  <label class="radio-tab-bar__option">
    <input class="radio-tab-bar__input" type="radio" name="radio-tab-bar" value="profile">
    <span class="radio-tab-bar__tab">
      <svg class="radio-tab-bar__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5" /><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5Z" /></svg>
      <span class="radio-tab-bar__label"><span>Profile</span></span>
    </span>
  </label>
</div>
</body></html>
