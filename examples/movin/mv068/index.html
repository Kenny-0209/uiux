<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peel card</title><link rel="stylesheet" href="card-peel.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-peel">
  <div class="card-peel__under">
    <div class="card-peel__title">You found it</div>
    <div class="card-peel__text">Code: MOVIN-25</div>
  </div>
  <div class="card-peel__sticker">
    <div class="card-peel__title">Peel me</div>
    <div class="card-peel__text">Drag the corner</div>
  </div>
  <div class="card-peel__flap-shadow" aria-hidden="true"><div class="card-peel__flap"></div></div>
  <button class="card-peel__corner" type="button" aria-label="Peel the sticker off" aria-pressed="false"></button>
</div>
<script src="card-peel.js"></script></body></html>
