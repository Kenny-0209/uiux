<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Jar radio button</title><link rel="stylesheet" href="radio-tip-jar.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-tip-jar">
  <div class="radio-tip-jar__jar" aria-hidden="true">
    <span class="radio-tip-jar__coin" style="--radio-tip-jar-i: 0"></span>
    <span class="radio-tip-jar__coin" style="--radio-tip-jar-i: 1"></span>
    <span class="radio-tip-jar__coin" style="--radio-tip-jar-i: 2"></span>
    <span class="radio-tip-jar__coin" style="--radio-tip-jar-i: 3"></span>
    <span class="radio-tip-jar__coin" style="--radio-tip-jar-i: 4"></span>
  </div>
  <span class="radio-tip-jar__amount" aria-hidden="true"></span>
  <div class="radio-tip-jar__row" role="radiogroup" aria-label="Tip">
    <label class="radio-tip-jar__option">
      <input class="radio-tip-jar__input" type="radio" name="radio-tip-jar" value="10">
      <span class="radio-tip-jar__chip">10%</span>
    </label>
    <label class="radio-tip-jar__option">
      <input class="radio-tip-jar__input" type="radio" name="radio-tip-jar" value="15" checked>
      <span class="radio-tip-jar__chip">15%</span>
    </label>
    <label class="radio-tip-jar__option">
      <input class="radio-tip-jar__input" type="radio" name="radio-tip-jar" value="20">
      <span class="radio-tip-jar__chip">20%</span>
    </label>
    <label class="radio-tip-jar__option">
      <input class="radio-tip-jar__input" type="radio" name="radio-tip-jar" value="25">
      <span class="radio-tip-jar__chip">25%</span>
    </label>
  </div>
</div>
</body></html>
