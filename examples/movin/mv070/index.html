<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch-off card</title><link rel="stylesheet" href="card-scratch.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-scratch">
  <div class="card-scratch__prize">
    <span class="card-scratch__title">You won</span>
    <span class="card-scratch__amount">A free month</span>
  </div>
  <canvas class="card-scratch__foil" aria-hidden="true"></canvas>
  <button class="card-scratch__action" type="button">Reveal</button>
</div>
<script src="card-scratch.js"></script></body></html>
