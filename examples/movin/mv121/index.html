<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike Task checkbox</title><link rel="stylesheet" href="checkbox-strike-task.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-strike-task">
  <input class="cb-strike-task__input" type="checkbox">
  <span class="cb-strike-task__box" aria-hidden="true">
    <svg viewBox="0 0 20 20"><path class="cb-strike-task__tick" pathLength="100" d="M4.5 10.5l4 4 7-9" /></svg>
  </span>
  <span class="cb-strike-task__text">
    Water the plants
    <svg class="cb-strike-task__scribble" viewBox="0 0 120 14" preserveAspectRatio="none" aria-hidden="true">
      <path class="cb-strike-task__pass cb-strike-task__pass--out" pathLength="100" d="M2 8C16 4 28 11 42 7S66 4 80 8 104 10 118 6" />
      <path class="cb-strike-task__pass cb-strike-task__pass--back" pathLength="100" d="M116 9C96 7 82 11 64 8S34 6 22 10 8 9 3 7" />
    </svg>
  </span>
</label>
</body></html>
