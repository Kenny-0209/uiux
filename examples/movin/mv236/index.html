<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pillow radio button</title><link rel="stylesheet" href="radio-pillow.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-pillow" role="radiogroup" aria-label="Fabric">
  <label class="radio-pillow__option">
    <input class="radio-pillow__input" type="radio" name="radio-pillow" value="Silk">
    <span class="radio-pillow__button"><span class="radio-pillow__dot"></span></span>
    <span class="radio-pillow__label">Silk</span>
  </label>
  <label class="radio-pillow__option">
    <input class="radio-pillow__input" type="radio" name="radio-pillow" value="Velvet">
    <span class="radio-pillow__button"><span class="radio-pillow__dot"></span></span>
    <span class="radio-pillow__label">Velvet</span>
  </label>
  <label class="radio-pillow__option">
    <input class="radio-pillow__input" type="radio" name="radio-pillow" value="Cotton">
    <span class="radio-pillow__button"><span class="radio-pillow__dot"></span></span>
    <span class="radio-pillow__label">Cotton</span>
  </label>
</div>
</body></html>
