<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power toggle</title><link rel="stylesheet" href="toggle-power.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><button class="toggle-power" type="button" role="switch" aria-checked="false" aria-label="Power">

    <path d="M6.34 6.34a9 9 0 1 0 11.32 0" />
  </svg>
</button>
<script src="toggle-power.js"></script></body></html>
