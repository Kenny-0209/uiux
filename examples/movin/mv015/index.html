<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Bar button</title><link rel="stylesheet" href="button-health-bar.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><button class="btn-health-bar" type="button">
  <span class="btn-health-bar__row">
    <span>BOSS</span>
    <span class="btn-health-bar__hp"><span class="btn-health-bar__full">1000</span><span class="btn-health-bar__hit">280</span> / 1000 HP</span>
  </span>
  <span class="btn-health-bar__track"><span class="btn-health-bar__fill"></span></span>
  <span class="btn-health-bar__hint"><span class="btn-health-bar__full">[ HOVER TO ATTACK ]</span><span class="btn-health-bar__hit">ATTACK!</span></span>
</button>
</body></html>
