<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fan toggle</title><link rel="stylesheet" href="toggle-fan.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-fan">
  <input class="toggle-fan__input" type="checkbox" role="switch">
  <span class="toggle-fan__fan" aria-hidden="true">
    <svg class="toggle-fan__blades" viewBox="0 0 40 40">
      <ellipse cx="20" cy="10.5" rx="5" ry="9" />
      <ellipse cx="20" cy="10.5" rx="5" ry="9" transform="rotate(120 20 20)" />
      <ellipse cx="20" cy="10.5" rx="5" ry="9" transform="rotate(240 20 20)" />
    </svg>
    <span class="toggle-fan__hub"></span>
  </span>
  <span class="toggle-fan__switch" aria-hidden="true"><span class="toggle-fan__knob"></span></span>
  <span class="toggle-fan__label">Fan</span>
</label>
<script src="toggle-fan.js"></script></body></html>
