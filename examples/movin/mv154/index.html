<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Burst input</title><link rel="stylesheet" href="input-particle-burst.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-particle-burst">
  <input class="field-particle-burst__input" type="text" placeholder="Focus to burst…" aria-label="Your text">
  <span class="field-particle-burst__particle" style="left: 4px; top: 4px; --field-particle-burst-x: -12px; --field-particle-burst-y: -12px; animation-delay: 0ms"></span>
  <span class="field-particle-burst__particle" style="left: 4px; top: 4px; --field-particle-burst-x: -18px; --field-particle-burst-y: -6px; animation-delay: 30ms"></span>
  <span class="field-particle-burst__particle" style="right: 4px; top: 4px; --field-particle-burst-x: 12px; --field-particle-burst-y: -12px; animation-delay: 60ms"></span>
  <span class="field-particle-burst__particle" style="right: 4px; top: 4px; --field-particle-burst-x: 18px; --field-particle-burst-y: -6px; animation-delay: 90ms"></span>
  <span class="field-particle-burst__particle" style="left: 4px; bottom: 4px; --field-particle-burst-x: -12px; --field-particle-burst-y: 12px; animation-delay: 120ms"></span>
  <span class="field-particle-burst__particle" style="left: 4px; bottom: 4px; --field-particle-burst-x: -18px; --field-particle-burst-y: 6px; animation-delay: 150ms"></span>
  <span class="field-particle-burst__particle" style="right: 4px; bottom: 4px; --field-particle-burst-x: 12px; --field-particle-burst-y: 12px; animation-delay: 180ms"></span>
  <span class="field-particle-burst__particle" style="right: 4px; bottom: 4px; --field-particle-burst-x: 18px; --field-particle-burst-y: 6px; animation-delay: 210ms"></span>
</div>
</body></html>
