<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holo Foil card</title><link rel="stylesheet" href="card-holo.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-holo">
  <div class="card-holo__card">
    <div class="card-holo__art" aria-hidden="true"><span class="card-holo__emblem"></span></div>

</div>
<script src="card-holo.js"></script></body></html>
