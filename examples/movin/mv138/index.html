<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Complete input</title><link rel="stylesheet" href="input-ghost.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="field-ghost">
  <span class="field-ghost__name">Email</span>
  <span class="field-ghost__box">
    <span class="field-ghost__mirror" aria-hidden="true"><span class="field-ghost__typed"></span><span class="field-ghost__rest"></span></span>
    <input class="field-ghost__input" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com">
    <span class="field-ghost__key" aria-hidden="true">Tab</span>
  </span>
  <span class="field-ghost__status" aria-live="polite"></span>
</label>
<script src="input-ghost.js"></script></body></html>
