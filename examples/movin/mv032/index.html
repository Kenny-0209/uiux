<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull Cord button</title><link rel="stylesheet" href="button-pull-cord.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="btn-pull-cord">
  <button class="btn-pull-cord__button" type="button" aria-pressed="false">
    <span class="btn-pull-cord__off">Lights off</span>
    <span class="btn-pull-cord__on">Lights on</span>
  </button>
  <svg class="btn-pull-cord__cord" aria-hidden="true" focusable="false"><path class="btn-pull-cord__line" /></svg>
  <span class="btn-pull-cord__bead" aria-hidden="true"></span>
</div>
<script src="button-pull-cord.js"></script></body></html>
