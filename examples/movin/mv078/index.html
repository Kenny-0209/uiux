<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wipe Reveal card</title><link rel="stylesheet" href="card-wipe-reveal.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-wipe-reveal">
  <div class="card-wipe-reveal__media">
    <span class="card-wipe-reveal__icon" aria-hidden="true">&#10022;</span>
    <span class="card-wipe-reveal__dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
  <div class="card-wipe-reveal__revealed">
    <div class="card-wipe-reveal__body">
      <div class="card-wipe-reveal__title">Revealed</div>
      <div class="card-wipe-reveal__text">Hover to uncover</div>
    </div>
  </div>
  <div class="card-wipe-reveal__body card-wipe-reveal__placeholder" aria-hidden="true">
    <div class="card-wipe-reveal__title">Hidden</div>
    <div class="card-wipe-reveal__text">Hover to uncover</div>
  </div>
</div>
</body></html>
