<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Targeting radio button</title><link rel="stylesheet" href="radio-targeting.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-targeting" role="radiogroup" aria-label="Target">
  <label class="radio-targeting__option">
    <input class="radio-targeting__input" type="radio" name="radio-targeting" value="Target Alpha">
    <span class="radio-targeting__bracket radio-targeting__bracket--tl"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--tr"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--bl"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--br"></span>
    <span class="radio-targeting__ring"><span class="radio-targeting__dot"></span></span>
    <span class="radio-targeting__label">Target Alpha</span>
  </label>
  <label class="radio-targeting__option">
    <input class="radio-targeting__input" type="radio" name="radio-targeting" value="Target Beta">
    <span class="radio-targeting__bracket radio-targeting__bracket--tl"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--tr"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--bl"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--br"></span>
    <span class="radio-targeting__ring"><span class="radio-targeting__dot"></span></span>
    <span class="radio-targeting__label">Target Beta</span>
  </label>
  <label class="radio-targeting__option">
    <input class="radio-targeting__input" type="radio" name="radio-targeting" value="Target Gamma">
    <span class="radio-targeting__bracket radio-targeting__bracket--tl"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--tr"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--bl"></span>
    <span class="radio-targeting__bracket radio-targeting__bracket--br"></span>
    <span class="radio-targeting__ring"><span class="radio-targeting__dot"></span></span>
    <span class="radio-targeting__label">Target Gamma</span>
  </label>
</div>
</body></html>
