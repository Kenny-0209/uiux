<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beam toggle</title><link rel="stylesheet" href="toggle-beam.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-beam">
  <input class="toggle-beam__input" type="checkbox" role="switch" aria-label="Beam">
  <span class="toggle-beam__hilt" aria-hidden="true"><span class="toggle-beam__button"></span></span>
  <span class="toggle-beam__blade" aria-hidden="true"></span>
</label>
</body></html>
