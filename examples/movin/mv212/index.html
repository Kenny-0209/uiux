<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clay radio button</title><link rel="stylesheet" href="radio-clay.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-clay" role="radiogroup" aria-label="Finish">
  <label class="radio-clay__option">
    <input class="radio-clay__input" type="radio" name="radio-clay" value="Chalk">
    <span class="radio-clay__ball"></span>
    <span class="radio-clay__label">Chalk</span>
  </label>
  <label class="radio-clay__option">
    <input class="radio-clay__input" type="radio" name="radio-clay" value="Stone">
    <span class="radio-clay__ball"></span>
    <span class="radio-clay__label">Stone</span>
  </label>
  <label class="radio-clay__option">
    <input class="radio-clay__input" type="radio" name="radio-clay" value="Slate">
    <span class="radio-clay__ball"></span>
    <span class="radio-clay__label">Slate</span>
  </label>
</div>
</body></html>
