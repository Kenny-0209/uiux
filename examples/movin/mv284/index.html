<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep toggle</title><link rel="stylesheet" href="toggle-sleep.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-sleep">
  <input class="toggle-sleep__input" type="checkbox" role="switch">
  <span class="toggle-sleep__track" aria-hidden="true">
    <span class="toggle-sleep__z">z</span>
    <span class="toggle-sleep__z">z</span>
    <span class="toggle-sleep__z">z</span>
    <span class="toggle-sleep__thumb">
      <svg class="toggle-sleep__bell" viewBox="0 0 24 24"><path d="M12 4.5A5 5 0 0 0 7 9.5v3L5.5 15.5h13L17 12.5v-3a5 5 0 0 0-5-5ZM10 18a2 2 0 0 0 4 0" /></svg>
      <svg class="toggle-sleep__moon" viewBox="0 0 24 24"><path d="M15 4.5a7.5 7.5 0 1 0 4.5 13.5A6 6 0 0 1 15 4.5Z" /></svg>
    </span>
  </span>
  <span class="toggle-sleep__label">Do not disturb</span>
</label>
</body></html>
