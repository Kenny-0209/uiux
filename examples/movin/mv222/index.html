<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip Card radio button</title><link rel="stylesheet" href="radio-flip-card.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-flip-card" role="radiogroup" aria-label="Plan">
  <label class="radio-flip-card__option">
    <input class="radio-flip-card__input" type="radio" name="radio-flip-card" value="Starter">
    <span class="radio-flip-card__card" aria-hidden="true">
      <span class="radio-flip-card__face radio-flip-card__face--front"><span class="radio-flip-card__name">Starter</span><span class="radio-flip-card__price">Free</span></span>
      <span class="radio-flip-card__face radio-flip-card__face--back"><svg viewBox="0 0 20 20"><path d="M5 10.5l3.5 3.5 6.5-8" /></svg><span class="radio-flip-card__name">Starter</span><span class="radio-flip-card__price">Free · Selected</span></span>
    </span>
    <span class="radio-flip-card__sr">Starter, Free</span>
  </label>
  <label class="radio-flip-card__option">
    <input class="radio-flip-card__input" type="radio" name="radio-flip-card" value="Pro" checked>
    <span class="radio-flip-card__card" aria-hidden="true">
      <span class="radio-flip-card__face radio-flip-card__face--front"><span class="radio-flip-card__name">Pro</span><span class="radio-flip-card__price">$12</span></span>
      <span class="radio-flip-card__face radio-flip-card__face--back"><svg viewBox="0 0 20 20"><path d="M5 10.5l3.5 3.5 6.5-8" /></svg><span class="radio-flip-card__name">Pro</span><span class="radio-flip-card__price">$12 · Selected</span></span>
    </span>
    <span class="radio-flip-card__sr">Pro, $12</span>
  </label>
  <label class="radio-flip-card__option">
    <input class="radio-flip-card__input" type="radio" name="radio-flip-card" value="Team">
    <span class="radio-flip-card__card" aria-hidden="true">
      <span class="radio-flip-card__face radio-flip-card__face--front"><span class="radio-flip-card__name">Team</span><span class="radio-flip-card__price">$29</span></span>
      <span class="radio-flip-card__face radio-flip-card__face--back"><svg viewBox="0 0 20 20"><path d="M5 10.5l3.5 3.5 6.5-8" /></svg><span class="radio-flip-card__name">Team</span><span class="radio-flip-card__price">$29 · Selected</span></span>
    </span>
    <span class="radio-flip-card__sr">Team, $29</span>
  </label>
</div>
</body></html>
