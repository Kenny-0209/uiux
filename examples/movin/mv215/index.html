<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daylight radio button</title><link rel="stylesheet" href="radio-daylight.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-daylight">
  <div class="radio-daylight__sky" aria-hidden="true">
    <span class="radio-daylight__star" style="top: 18px; left: 30px"></span>
    <span class="radio-daylight__star" style="top: 34px; left: 64px"></span>
    <span class="radio-daylight__star" style="top: 16px; left: 150px"></span>
    <span class="radio-daylight__star" style="top: 40px; left: 176px"></span>
    <span class="radio-daylight__star" style="top: 28px; left: 118px"></span>
    <span class="radio-daylight__star" style="top: 12px; left: 92px"></span>
    <span class="radio-daylight__sun"></span>
    <span class="radio-daylight__ground"></span>
  </div>
  <div class="radio-daylight__row" role="radiogroup" aria-label="Time of day">
    <label class="radio-daylight__option">
      <input class="radio-daylight__input" type="radio" name="radio-daylight" value="morning" checked>
      <span class="radio-daylight__chip">Morning</span>
    </label>
    <label class="radio-daylight__option">
      <input class="radio-daylight__input" type="radio" name="radio-daylight" value="noon">
      <span class="radio-daylight__chip">Noon</span>
    </label>
    <label class="radio-daylight__option">
      <input class="radio-daylight__input" type="radio" name="radio-daylight" value="evening">
      <span class="radio-daylight__chip">Evening</span>
    </label>
    <label class="radio-daylight__option">
      <input class="radio-daylight__input" type="radio" name="radio-daylight" value="night">
      <span class="radio-daylight__chip">Night</span>
    </label>
  </div>
</div>
</body></html>
