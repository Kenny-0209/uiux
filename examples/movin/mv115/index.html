<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smile checkbox</title><link rel="stylesheet" href="checkbox-smile.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-smile">
  <input class="cb-smile__input" type="checkbox">
  <span class="cb-smile__face" aria-hidden="true">
    <svg viewBox="0 0 32 32">
      <circle class="cb-smile__dot" cx="11.5" cy="13" r="1.8" />
      <circle class="cb-smile__dot" cx="20.5" cy="13" r="1.8" />
      <path class="cb-smile__arc cb-smile__arc--eye" pathLength="100" d="M9 14q2.5-3 5 0" />
      <path class="cb-smile__arc cb-smile__arc--eye" pathLength="100" d="M18 14q2.5-3 5 0" />
      <path class="cb-smile__flat" d="M12 21h8" />
      <path class="cb-smile__arc cb-smile__arc--mouth" pathLength="100" d="M10.5 19q5.5 6 11 0" />
    </svg>
  </span>
  <span class="cb-smile__label">Happy with it</span>
</label>
</body></html>
