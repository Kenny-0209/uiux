<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Chips input</title><link rel="stylesheet" href="input-chips.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-chips">
  <span class="field-chips__label">Tags</span>
  <div class="field-chips__box">
    <ul class="field-chips__list" aria-label="Tags">
      <li class="field-chips__chip"><span class="field-chips__text">motion</span><button class="field-chips__remove" type="button" aria-label="Remove motion"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 3.5l5 5m0-5-5 5" /></svg></button></li>
      <li class="field-chips__chip"><span class="field-chips__text">css</span><button class="field-chips__remove" type="button" aria-label="Remove css"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 3.5l5 5m0-5-5 5" /></svg></button></li>
    </ul>
    <input class="field-chips__input" type="text" placeholder="Add a tag" aria-label="Add a tag" enterkeyhint="enter" spellcheck="false">
  </div>
  <span class="field-chips__status" aria-live="polite"></span>
</div>
<script src="input-chips.js"></script></body></html>
