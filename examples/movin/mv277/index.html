<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel toggle</title><link rel="stylesheet" href="toggle-pixel.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-pixel">
  <input class="toggle-pixel__input" type="checkbox" role="switch">
  <span class="toggle-pixel__track" aria-hidden="true">
    <span class="toggle-pixel__fill"></span>
    <span class="toggle-pixel__thumb"></span>
  </span>
  <span class="toggle-pixel__label">Retro mode</span>
</label>
</body></html>
