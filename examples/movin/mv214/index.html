<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor radio button</title><link rel="stylesheet" href="radio-cursor.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-cursor" role="radiogroup" aria-label="Theme">
  <span class="radio-cursor__pill" aria-hidden="true"></span>
  <label class="radio-cursor__option">
    <input class="radio-cursor__input" type="radio" name="radio-cursor" value="Photon" checked>
    <span class="radio-cursor__ring"><span class="radio-cursor__dot"></span></span>
    <span class="radio-cursor__label">Photon</span>
  </label>
  <label class="radio-cursor__option">
    <input class="radio-cursor__input" type="radio" name="radio-cursor" value="Nebula">
    <span class="radio-cursor__ring"><span class="radio-cursor__dot"></span></span>
    <span class="radio-cursor__label">Nebula</span>
  </label>
  <label class="radio-cursor__option">
    <input class="radio-cursor__input" type="radio" name="radio-cursor" value="Aurora">
    <span class="radio-cursor__ring"><span class="radio-cursor__dot"></span></span>
    <span class="radio-cursor__label">Aurora</span>
  </label>
</div>
<script src="radio-cursor.js"></script></body></html>
