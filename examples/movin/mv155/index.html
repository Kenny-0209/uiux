<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peek input</title><link rel="stylesheet" href="input-peek.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-peek">
  <label class="field-peek__label">
    <span class="field-peek__name">Password</span>
    <input class="field-peek__input" type="password" autocomplete="new-password" spellcheck="false" value="motion-is-fun">
  </label>
  <button class="field-peek__toggle" type="button" aria-label="Show password" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g class="field-peek__open">
        <path class="field-peek__white" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
        <circle class="field-peek__pupil" cx="12" cy="12" r="3.2" />
      </g>
      <path class="field-peek__shut" d="M2.5 11.5S6 16.5 12 16.5s9.5-5 9.5-5M5.5 14.6 4 16.6M9.3 16.2l-.7 2.3M14.7 16.2l.7 2.3M18.5 14.6l1.5 2" />
    </svg>
  </button>
</div>
<script src="input-peek.js"></script></body></html>
