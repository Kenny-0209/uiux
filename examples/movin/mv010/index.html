<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold button</title><link rel="stylesheet" href="button-fold.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><button class="btn-fold" type="button" aria-label="Send letter" data-alt="Sent">
  <span class="btn-fold__paper" aria-hidden="true">
    <span class="btn-fold__half btn-fold__half--bottom">
      <span class="btn-fold__face"><span class="btn-fold__text">Send letter</span></span>
      <span class="btn-fold__shade"></span>
    </span>
    <span class="btn-fold__half btn-fold__half--top">
      <span class="btn-fold__face"><span class="btn-fold__text">Send letter</span></span>
      <span class="btn-fold__back"></span>
    </span>
  </span>
</button>
<script src="button-fold.js"></script></body></html>
