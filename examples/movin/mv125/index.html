<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Border Draw input</title><link rel="stylesheet" href="input-border-draw.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-border-draw">
  <span class="field-border-draw__edge field-border-draw__edge--top" aria-hidden="true"></span>
  <span class="field-border-draw__edge field-border-draw__edge--right" aria-hidden="true"></span>
  <span class="field-border-draw__edge field-border-draw__edge--bottom" aria-hidden="true"></span>
  <span class="field-border-draw__edge field-border-draw__edge--left" aria-hidden="true"></span>
  <input class="field-border-draw__input" type="text" placeholder="Focus me" aria-label="Your text">
</div>
</body></html>
