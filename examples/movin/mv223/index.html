<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folders radio button</title><link rel="stylesheet" href="radio-folders.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-folders" role="radiogroup" aria-label="Folder">
  <label class="radio-folders__option" style="--radio-folders-i: 0">
    <input class="radio-folders__input" type="radio" name="radio-folders" value="work" checked>
    <span class="radio-folders__back" aria-hidden="true"></span>
    <span class="radio-folders__paper" aria-hidden="true"></span>
    <span class="radio-folders__tab">Work</span>
    <span class="radio-folders__body" aria-hidden="true"></span>
  </label>
  <label class="radio-folders__option" style="--radio-folders-i: 1">
    <input class="radio-folders__input" type="radio" name="radio-folders" value="personal">
    <span class="radio-folders__back" aria-hidden="true"></span>
    <span class="radio-folders__paper" aria-hidden="true"></span>
    <span class="radio-folders__tab">Personal</span>
    <span class="radio-folders__body" aria-hidden="true"></span>
  </label>
  <label class="radio-folders__option" style="--radio-folders-i: 2">
    <input class="radio-folders__input" type="radio" name="radio-folders" value="archive">
    <span class="radio-folders__back" aria-hidden="true"></span>
    <span class="radio-folders__paper" aria-hidden="true"></span>
    <span class="radio-folders__tab">Archive</span>
    <span class="radio-folders__body" aria-hidden="true"></span>
  </label>
</div>
</body></html>
