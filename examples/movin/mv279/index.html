<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocker toggle</title><link rel="stylesheet" href="toggle-rocker.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-rocker">
  <input class="toggle-rocker__input" type="checkbox" role="switch">
  <span class="toggle-rocker__plate" aria-hidden="true">
    <span class="toggle-rocker__led"></span>
    <span class="toggle-rocker__paddle"><span class="toggle-rocker__mark">I</span><span class="toggle-rocker__mark">O</span></span>
  </span>
  <span class="toggle-rocker__label">Lights</span>
</label>
</body></html>
