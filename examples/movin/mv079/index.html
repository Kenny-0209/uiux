<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmark checkbox</title><link rel="stylesheet" href="checkbox-bookmark.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-bookmark">
  <input class="cb-bookmark__input" type="checkbox">
  <span class="cb-bookmark__icon" aria-hidden="true">
    <span class="cb-bookmark__ribbon"><span class="cb-bookmark__fill"></span></span>
  </span>
  <span class="cb-bookmark__label">Save for later</span>
</label>
</body></html>
