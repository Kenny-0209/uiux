<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loupe button</title><link rel="stylesheet" href="button-loupe.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><button class="btn-loupe" type="button">
  <span class="btn-loupe__content">
    <span class="btn-loupe__label">Read the fine print</span>
    <span class="btn-loupe__fine">No catch. Free forever. Cancel any time. Really, we checked.</span>
  </span>
  <span class="btn-loupe__lens" aria-hidden="true"><span class="btn-loupe__zoom"></span></span>
</button>
<script src="button-loupe.js"></script></body></html>
