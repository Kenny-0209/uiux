<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic radio button</title><link rel="stylesheet" href="radio-magnetic.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-magnetic" role="radiogroup" aria-label="Direction">
  <span class="radio-magnetic__pill" aria-hidden="true"></span>
  <label class="radio-magnetic__option">
    <input class="radio-magnetic__input" type="radio" name="radio-magnetic" value="North">
    <span class="radio-magnetic__ring"><span class="radio-magnetic__dot"></span></span>
    <span class="radio-magnetic__label">North</span>
  </label>
  <label class="radio-magnetic__option">
    <input class="radio-magnetic__input" type="radio" name="radio-magnetic" value="Center" checked>
    <span class="radio-magnetic__ring"><span class="radio-magnetic__dot"></span></span>
    <span class="radio-magnetic__label">Center</span>
  </label>
  <label class="radio-magnetic__option">
    <input class="radio-magnetic__input" type="radio" name="radio-magnetic" value="South">
    <span class="radio-magnetic__ring"><span class="radio-magnetic__dot"></span></span>
    <span class="radio-magnetic__label">South</span>
  </label>
</div>
<script src="radio-magnetic.js"></script></body></html>
