<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperture toggle</title><link rel="stylesheet" href="toggle-aperture.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-aperture">
  <input class="toggle-aperture__input" type="checkbox" role="switch">
  <span class="toggle-aperture__lens" aria-hidden="true">
    <span class="toggle-aperture__blade" style="--i: 0"></span>
    <span class="toggle-aperture__blade" style="--i: 1"></span>
    <span class="toggle-aperture__blade" style="--i: 2"></span>
    <span class="toggle-aperture__blade" style="--i: 3"></span>
    <span class="toggle-aperture__blade" style="--i: 4"></span>
    <span class="toggle-aperture__blade" style="--i: 5"></span>
  </span>
  <span class="toggle-aperture__label">Camera</span>
</label>
</body></html>
