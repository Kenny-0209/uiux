<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack card</title><link rel="stylesheet" href="card-stack.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-stack">
  <div class="card-stack__pile">
    <div class="card-stack__card card-stack__card--back" aria-hidden="true"></div>
    <div class="card-stack__card card-stack__card--middle" aria-hidden="true"></div>
    <div class="card-stack__card card-stack__card--front">
      <div class="card-stack__title">Stack</div>
      <div class="card-stack__text">Hover to fan out</div>
    </div>
  </div>
</div>
</body></html>
