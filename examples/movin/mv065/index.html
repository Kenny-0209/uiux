<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenticular card</title><link rel="stylesheet" href="card-lenticular.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-lenticular" tabindex="0" aria-label="Lenticular card: day turns to night as it tilts">
  <div class="card-lenticular__card">
    <div class="card-lenticular__scene card-lenticular__scene--day" aria-hidden="true">
      <span class="card-lenticular__sun"></span>
      <span class="card-lenticular__hill"></span>
    </div>
    <div class="card-lenticular__scene card-lenticular__scene--night" aria-hidden="true">
      <span class="card-lenticular__stars"></span>
      <span class="card-lenticular__moon"></span>
      <span class="card-lenticular__hill"></span>
    </div>
    <div class="card-lenticular__ridges" aria-hidden="true"></div>
  </div>
  <div class="card-lenticular__caption">
    <span class="card-lenticular__title">Day &amp; Night</span>
    <span class="card-lenticular__text">Move across to tilt</span>
  </div>
</div>
<script src="card-lenticular.js"></script></body></html>
