<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourglass loader</title><link rel="stylesheet" href="loader-hourglass.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="loader-hourglass" role="status" aria-label="Loading">
  <div class="loader-hourglass__glass" aria-hidden="true">
    <span class="loader-hourglass__bulb loader-hourglass__bulb--top"><span class="loader-hourglass__sand"></span></span>
    <span class="loader-hourglass__stream"></span>
    <span class="loader-hourglass__bulb loader-hourglass__bulb--bottom"><span class="loader-hourglass__sand"></span></span>
    <svg viewBox="0 0 40 56">
      <path d="M9 6h22c0 10-9 15-9 22 0 7 9 12 9 22H9c0-10 9-15 9-22 0-7-9-12-9-22Z" />
      <path d="M5 4.5h30M5 51.5h30" />
    </svg>
  </div>
</div>
</body></html>
