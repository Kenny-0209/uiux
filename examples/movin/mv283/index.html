<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifter toggle</title><link rel="stylesheet" href="toggle-shifter.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-shifter">
  <input class="toggle-shifter__input" type="checkbox" role="switch">
  <span class="toggle-shifter__plate" aria-hidden="true">
    <svg class="toggle-shifter__gate" viewBox="0 0 84 100" fill="none">
      <path d="M24 22V50H60V78" />
    </svg>
    <span class="toggle-shifter__gear toggle-shifter__gear--p">P</span>
    <span class="toggle-shifter__gear toggle-shifter__gear--d">D</span>
    <span class="toggle-shifter__knob"></span>
  </span>
  <span class="toggle-shifter__label">Drive</span>
</label>
</body></html>
