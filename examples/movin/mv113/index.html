<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shake Lock checkbox</title><link rel="stylesheet" href="checkbox-shake-lock.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-shake-lock">
  <input class="cb-shake-lock__input" type="checkbox" aria-label="Remember me">
  <span class="cb-shake-lock__box" aria-hidden="true">
    <svg class="cb-shake-lock__check" width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1.5 5L5 8.5L11.5 1.5" stroke="light-dark(#373a40, #f1f2f3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
  </span>
</label>
<script src="checkbox-shake-lock.js"></script></body></html>
