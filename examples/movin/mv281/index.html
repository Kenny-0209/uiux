<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seesaw toggle</title><link rel="stylesheet" href="toggle-seesaw.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-seesaw">
  <input class="toggle-seesaw__input" type="checkbox" role="switch">
  <span class="toggle-seesaw__rig" aria-hidden="true">
    <span class="toggle-seesaw__beam"><span class="toggle-seesaw__ball"></span></span>
    <span class="toggle-seesaw__pivot"></span>
  </span>
  <span class="toggle-seesaw__label">Balance</span>
</label>
</body></html>
