<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shake input</title><link rel="stylesheet" href="input-shake.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><form class="field-shake" novalidate>
  <div class="field-shake__group">
    <input class="field-shake__input" type="text" placeholder="Required field" aria-label="Required field" aria-describedby="field-shake-msg">
    <span class="field-shake__error" id="field-shake-msg" hidden>This field is required</span>
  </div>
  <button class="field-shake__submit" type="submit">Submit</button>
</form>
<script src="input-shake.js"></script></body></html>
