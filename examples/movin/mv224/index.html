<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost radio button</title><link rel="stylesheet" href="radio-frost.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-frost" role="radiogroup" aria-label="Climate">
  <span class="radio-frost__pill" aria-hidden="true"></span>
  <label class="radio-frost__option">
    <input class="radio-frost__input" type="radio" name="radio-frost" value="Glacier" checked>
    <span class="radio-frost__ring"><span class="radio-frost__dot"></span></span>
    <span class="radio-frost__label">Glacier</span>
  </label>
  <label class="radio-frost__option">
    <input class="radio-frost__input" type="radio" name="radio-frost" value="Tundra">
    <span class="radio-frost__ring"><span class="radio-frost__dot"></span></span>
    <span class="radio-frost__label">Tundra</span>
  </label>
  <label class="radio-frost__option">
    <input class="radio-frost__input" type="radio" name="radio-frost" value="Arctic">
    <span class="radio-frost__ring"><span class="radio-frost__dot"></span></span>
    <span class="radio-frost__label">Arctic</span>
  </label>
</div>
<script src="radio-frost.js"></script></body></html>
