<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeout input</title><link rel="stylesheet" href="input-typeout.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-typeout">
  <input class="field-typeout__input" type="text" aria-label="Your message">

</div>
<script src="input-typeout.js"></script></body></html>
