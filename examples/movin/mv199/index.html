<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton loader</title><link rel="stylesheet" href="loader-skeleton.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="loader-skeleton" role="status" aria-busy="true" aria-label="Loading content">
  <div class="loader-skeleton__head">
    <span class="loader-skeleton__bone loader-skeleton__avatar"></span>
    <div class="loader-skeleton__lines">
      <span class="loader-skeleton__bone" style="height: 12px; width: 70%"></span>
      <span class="loader-skeleton__bone" style="height: 10px; width: 45%"></span>
    </div>
  </div>
  <span class="loader-skeleton__bone" style="height: 12px; width: 100%"></span>
  <span class="loader-skeleton__bone" style="height: 12px; width: 80%"></span>
</div>
</body></html>
