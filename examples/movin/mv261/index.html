<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caps Lock toggle</title><link rel="stylesheet" href="toggle-caps.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-caps">
  <input class="toggle-caps__input" type="checkbox" role="switch">
  <span class="toggle-caps__well" aria-hidden="true">
    <span class="toggle-caps__key">
      <span class="toggle-caps__led"></span>
      <span class="toggle-caps__legend">caps lock</span>
    </span>
  </span>
  <span class="toggle-caps__label">Caps lock</span>
</label>
</body></html>
