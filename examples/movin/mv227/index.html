<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Drop radio button</title><link rel="stylesheet" href="radio-ink-drop.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-ink-drop" role="radiogroup" aria-label="Ink">
  <label class="radio-ink-drop__option">
    <input class="radio-ink-drop__input" type="radio" name="radio-ink-drop" value="Graphite" checked>
    <span class="radio-ink-drop__well"><span class="radio-ink-drop__ink"></span><span class="radio-ink-drop__dot"></span></span>
    <span class="radio-ink-drop__label">Graphite</span>
  </label>
  <label class="radio-ink-drop__option">
    <input class="radio-ink-drop__input" type="radio" name="radio-ink-drop" value="Obsidian">
    <span class="radio-ink-drop__well"><span class="radio-ink-drop__ink"></span><span class="radio-ink-drop__dot"></span></span>
    <span class="radio-ink-drop__label">Obsidian</span>
  </label>
  <label class="radio-ink-drop__option">
    <input class="radio-ink-drop__input" type="radio" name="radio-ink-drop" value="Midnight">
    <span class="radio-ink-drop__well"><span class="radio-ink-drop__ink"></span><span class="radio-ink-drop__dot"></span></span>
    <span class="radio-ink-drop__label">Midnight</span>
  </label>
</div>
</body></html>
