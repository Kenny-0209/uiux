<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zipper toggle</title><link rel="stylesheet" href="toggle-zipper.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-zipper">
  <input class="toggle-zipper__input" type="checkbox" role="switch">
  <span class="toggle-zipper__track" aria-hidden="true">
    <span class="toggle-zipper__open"></span>
    <span class="toggle-zipper__closed"></span>
    <span class="toggle-zipper__slider"><span class="toggle-zipper__pull"></span></span>
  </span>
  <span class="toggle-zipper__label">Private</span>
</label>
</body></html>
