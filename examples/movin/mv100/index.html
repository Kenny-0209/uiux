<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morph Line checkbox</title><link rel="stylesheet" href="checkbox-morph-line.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-morph-line">
  <input class="cb-morph-line__input" type="checkbox" aria-label="Remember me">
  <span class="cb-morph-line__box" aria-hidden="true">
    <svg class="cb-morph-line__mark" width="13" height="10" viewBox="0 0 13 10" fill="none">
      <path d="M3 6.5 L10 6.5" stroke="light-dark(#50535b, #c6c8cd)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
</label>
<script src="checkbox-morph-line.js"></script></body></html>
