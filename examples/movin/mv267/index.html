<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faucet toggle</title><link rel="stylesheet" href="toggle-faucet.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-faucet">
  <input class="toggle-faucet__input" type="checkbox" role="switch">
  <span class="toggle-faucet__tap" aria-hidden="true">
    <span class="toggle-faucet__stream"><span class="toggle-faucet__flow"></span></span>
    <span class="toggle-faucet__pool">
      <span class="toggle-faucet__ring"></span>
      <span class="toggle-faucet__ring"></span>
    </span>
    <span class="toggle-faucet__wall"></span>
    <span class="toggle-faucet__body"></span>
    <span class="toggle-faucet__spout"></span>
    <span class="toggle-faucet__lever"></span>
  </span>
  <span class="toggle-faucet__label">Water</span>
</label>
</body></html>
