<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count Ring input</title><link rel="stylesheet" href="input-count-ring.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-count-ring">
  <input class="field-count-ring__input" type="text" maxlength="80" placeholder="Write something…" aria-label="Your text">
  <span class="field-count-ring__ring" aria-hidden="true">
    <svg width="32" height="32" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="14" fill="none" stroke="light-dark(rgba(55, 58, 64, 0.1), rgba(241, 242, 243, 0.1))" stroke-width="2" />
      <circle class="field-count-ring__arc" cx="16" cy="16" r="14" fill="none" stroke-width="2" stroke-linecap="round" pathLength="1" />
    </svg>
    <span class="field-count-ring__left">80</span>
  </span>
</div>
<script src="input-count-ring.js"></script></body></html>
