<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora card</title><link rel="stylesheet" href="card-aurora.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-aurora">
  <div class="card-aurora__field" aria-hidden="true">
    <span class="card-aurora__blob card-aurora__blob--1"></span>
    <span class="card-aurora__blob card-aurora__blob--2"></span>
    <span class="card-aurora__blob card-aurora__blob--3"></span>
  </div>
  <div class="card-aurora__content">
    <div class="card-aurora__media"></div>
    <div class="card-aurora__body">
      <div class="card-aurora__title">Aurora</div>
      <div class="card-aurora__text">Floating light blobs</div>
    </div>
  </div>
</div>
</body></html>
