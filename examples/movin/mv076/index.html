<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri-fold card</title><link rel="stylesheet" href="card-trifold.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-trifold" tabindex="0">
  <div class="card-trifold__panel card-trifold__panel--left">
    <div class="card-trifold__face">
      <span class="card-trifold__num">01</span>
      <span class="card-trifold__title">Plan</span>
      <span class="card-trifold__text">Sketch the flow</span>
    </div>
    <div class="card-trifold__face card-trifold__face--back" aria-hidden="true"></div>
  </div>
  <div class="card-trifold__panel card-trifold__panel--middle">
    <div class="card-trifold__face">
      <span class="card-trifold__num">02</span>
      <span class="card-trifold__title">Build</span>
      <span class="card-trifold__text">Make it move</span>
    </div>
  </div>
  <div class="card-trifold__panel card-trifold__panel--right">
    <div class="card-trifold__face">
      <span class="card-trifold__num">03</span>
      <span class="card-trifold__title">Ship</span>
      <span class="card-trifold__text">Watch it land</span>
    </div>
    <div class="card-trifold__face card-trifold__face--back card-trifold__face--cover">
      <span class="card-trifold__cover-title">Field Guide</span>
      <span class="card-trifold__text">Hover to open</span>
    </div>
  </div>
</div>
</body></html>
