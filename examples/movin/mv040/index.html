<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skewed button</title><link rel="stylesheet" href="button-skewed.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><button class="btn-skewed" type="button">
  <span class="btn-skewed__fill" aria-hidden="true"></span>
  <span class="btn-skewed__frame" aria-hidden="true"></span>
  <span class="btn-skewed__label">SKEWED</span>
</button>
</body></html>
