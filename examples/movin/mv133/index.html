<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Letters input</title><link rel="stylesheet" href="input-drop.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="field-drop">
  <span class="field-drop__name">Project name</span>
  <span class="field-drop__box">
    <input class="field-drop__input" type="text" placeholder="Name it something good" maxlength="40" spellcheck="false" autocomplete="off">
    <span class="field-drop__mirror" aria-hidden="true"><span class="field-drop__line"></span></span>
  </span>
</label>
<script src="input-drop.js"></script></body></html>
