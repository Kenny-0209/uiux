<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble radio button</title><link rel="stylesheet" href="radio-bubble.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-bubble" role="radiogroup" aria-label="Plan">
  <label class="radio-bubble__option">
    <input class="radio-bubble__input" type="radio" name="radio-bubble" value="Starter">
    <span class="radio-bubble__bubble"><span class="radio-bubble__shine"></span></span>
    <span class="radio-bubble__label">Starter</span>
  </label>
  <label class="radio-bubble__option">
    <input class="radio-bubble__input" type="radio" name="radio-bubble" value="Pro">
    <span class="radio-bubble__bubble"><span class="radio-bubble__shine"></span></span>
    <span class="radio-bubble__label">Pro</span>
  </label>
  <label class="radio-bubble__option">
    <input class="radio-bubble__input" type="radio" name="radio-bubble" value="Enterprise">
    <span class="radio-bubble__bubble"><span class="radio-bubble__shine"></span></span>
    <span class="radio-bubble__label">Enterprise</span>
  </label>
</div>
</body></html>
