<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar radio button</title><link rel="stylesheet" href="radio-radar.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-radar" role="radiogroup" aria-label="Signal">
  <label class="radio-radar__option">
    <input class="radio-radar__input" type="radio" name="radio-radar" value="Alpha">
    <span class="radio-radar__scope">
      <span class="radio-radar__ping"></span>
      <span class="radio-radar__ping"></span>
      <span class="radio-radar__ring"></span>
      <span class="radio-radar__dot"></span>
    </span>
    <span class="radio-radar__label">SIGNAL_ALPHA</span>
  </label>
  <label class="radio-radar__option">
    <input class="radio-radar__input" type="radio" name="radio-radar" value="Beta">
    <span class="radio-radar__scope">
      <span class="radio-radar__ping"></span>
      <span class="radio-radar__ping"></span>
      <span class="radio-radar__ring"></span>
      <span class="radio-radar__dot"></span>
    </span>
    <span class="radio-radar__label">SIGNAL_BETA</span>
  </label>
  <label class="radio-radar__option">
    <input class="radio-radar__input" type="radio" name="radio-radar" value="Gamma">
    <span class="radio-radar__scope">
      <span class="radio-radar__ping"></span>
      <span class="radio-radar__ping"></span>
      <span class="radio-radar__ring"></span>
      <span class="radio-radar__dot"></span>
    </span>
    <span class="radio-radar__label">SIGNAL_GAMMA</span>
  </label>
</div>
</body></html>
