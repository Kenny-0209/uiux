<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offset Block radio button</title><link rel="stylesheet" href="radio-offset-block.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-offset-block" role="radiogroup" aria-label="Layer">
  <label class="radio-offset-block__option">
    <input class="radio-offset-block__input" type="radio" name="radio-offset-block" value="Layer 01">
    <span class="radio-offset-block__ring"><span class="radio-offset-block__dot"></span></span>
    <span class="radio-offset-block__label">Layer 01</span>
  </label>
  <label class="radio-offset-block__option">
    <input class="radio-offset-block__input" type="radio" name="radio-offset-block" value="Layer 02">
    <span class="radio-offset-block__ring"><span class="radio-offset-block__dot"></span></span>
    <span class="radio-offset-block__label">Layer 02</span>
  </label>
  <label class="radio-offset-block__option">
    <input class="radio-offset-block__input" type="radio" name="radio-offset-block" value="Layer 03">
    <span class="radio-offset-block__ring"><span class="radio-offset-block__dot"></span></span>
    <span class="radio-offset-block__label">Layer 03</span>
  </label>
</div>
</body></html>
