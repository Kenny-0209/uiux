<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycap checkbox</title><link rel="stylesheet" href="checkbox-keycap.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-keycap">
  <input class="cb-keycap__input" type="checkbox">
  <span class="cb-keycap__key" aria-hidden="true">
    <span class="cb-keycap__led"></span>
    <span class="cb-keycap__legend">Aa</span>
  </span>
  <span class="cb-keycap__label">Caps lock</span>
</label>
</body></html>
