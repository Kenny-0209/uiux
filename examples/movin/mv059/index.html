<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip card</title><link rel="stylesheet" href="card-flip.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-flip">
  <div class="card-flip__inner">
    <div class="card-flip__face card-flip__front">
      <div class="card-flip__media"></div>
      <div class="card-flip__body">
        <div class="card-flip__title">Front</div>
        <div class="card-flip__text">Hover to flip</div>
      </div>
    </div>
    <div class="card-flip__face card-flip__back">
      <div class="card-flip__icon" aria-hidden="true">&#10022;</div>
      <div class="card-flip__title">Back side</div>
      <div class="card-flip__text">Revealed!</div>
    </div>
  </div>
</div>
</body></html>
