<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotating Gradient button</title><link rel="stylesheet" href="button-rotating-gradient.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><button class="btn-rotating-gradient" type="button">
  <span class="btn-rotating-gradient__spin" aria-hidden="true"></span>
  <span class="btn-rotating-gradient__shade" aria-hidden="true"></span>
  <span class="btn-rotating-gradient__label">Hover Me</span>
</button>
</body></html>
