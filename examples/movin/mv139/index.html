<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitch Error input</title><link rel="stylesheet" href="input-glitch-error.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><form class="field-glitch-error" novalidate>
  <input class="field-glitch-error__input" type="text" placeholder="Required field…" aria-label="Required field" aria-describedby="field-glitch-error-msg">
  <p class="field-glitch-error__error" id="field-glitch-error-msg" hidden>This field is required.</p>
  <button class="field-glitch-error__submit" type="submit">Submit (empty to trigger)</button>
</form>
<script src="input-glitch-error.js"></script></body></html>
