<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism radio button</title><link rel="stylesheet" href="radio-prism.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-prism" role="radiogroup" aria-label="Shipping">
  <label class="radio-prism__option">
    <input class="radio-prism__input" type="radio" name="radio-prism" value="Standard" checked>
    <span class="radio-prism__gem"><span class="radio-prism__dot"></span></span>
    <span class="radio-prism__label">Standard</span>
  </label>
  <label class="radio-prism__option">
    <input class="radio-prism__input" type="radio" name="radio-prism" value="Express">
    <span class="radio-prism__gem"><span class="radio-prism__dot"></span></span>
    <span class="radio-prism__label">Express</span>
  </label>
  <label class="radio-prism__option">
    <input class="radio-prism__input" type="radio" name="radio-prism" value="Overnight">
    <span class="radio-prism__gem"><span class="radio-prism__dot"></span></span>
    <span class="radio-prism__label">Overnight</span>
  </label>
</div>
</body></html>
