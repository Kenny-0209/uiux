<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Spin input</title><link rel="stylesheet" href="input-gradient-spin.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-gradient-spin">
  <span class="field-gradient-spin__spin" aria-hidden="true"></span>
  <span class="field-gradient-spin__inner">
    <input class="field-gradient-spin__input" type="text" placeholder="Focus for spin…" aria-label="Your text">
  </span>
</div>
</body></html>
