<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split Flap toggle</title><link rel="stylesheet" href="toggle-flap.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-flap">
  <input class="toggle-flap__input" type="checkbox" role="switch">
  <span class="toggle-flap__board" aria-hidden="true">
    <span class="toggle-flap__cell">
      <span class="toggle-flap__half toggle-flap__half--top"><span>O</span></span>
      <span class="toggle-flap__half toggle-flap__half--bottom"><span>O</span></span>
      <span class="toggle-flap__leaf toggle-flap__leaf--top"><span>O</span></span>
      <span class="toggle-flap__leaf toggle-flap__leaf--bottom"><span>O</span></span>
    </span>
    <span class="toggle-flap__cell">
      <span class="toggle-flap__half toggle-flap__half--top"><span>F</span></span>
      <span class="toggle-flap__half toggle-flap__half--bottom"><span>F</span></span>
      <span class="toggle-flap__leaf toggle-flap__leaf--top"><span>F</span></span>
      <span class="toggle-flap__leaf toggle-flap__leaf--bottom"><span>F</span></span>
    </span>
    <span class="toggle-flap__cell">
      <span class="toggle-flap__half toggle-flap__half--top"><span>F</span></span>
      <span class="toggle-flap__half toggle-flap__half--bottom"><span>F</span></span>
      <span class="toggle-flap__leaf toggle-flap__leaf--top"><span>F</span></span>
      <span class="toggle-flap__leaf toggle-flap__leaf--bottom"><span>F</span></span>
    </span>
  </span>
  <span class="toggle-flap__label">Status</span>
</label>
<script src="toggle-flap.js"></script></body></html>
