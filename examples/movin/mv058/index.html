<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envelope card</title><link rel="stylesheet" href="card-envelope.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-envelope" tabindex="0">
  <div class="card-envelope__body">
    <div class="card-envelope__back" aria-hidden="true"></div>
    <div class="card-envelope__letter">
      <div class="card-envelope__title">You're invited</div>
      <div class="card-envelope__text">Friday, 8 pm at the Loft</div>
    </div>
    <div class="card-envelope__front" aria-hidden="true"></div>
    <div class="card-envelope__flap" aria-hidden="true"><span class="card-envelope__seal"></span></div>
  </div>
</div>
</body></html>
