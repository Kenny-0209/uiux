<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog-ear checkbox</title><link rel="stylesheet" href="checkbox-dog-ear.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-dog-ear">
  <input class="cb-dog-ear__input" type="checkbox">
  <span class="cb-dog-ear__page" aria-hidden="true">
    <svg viewBox="0 0 20 20"><path class="cb-dog-ear__tick" pathLength="100" d="M5 10.5l3.5 3.5 6.5-8" /></svg>
    <span class="cb-dog-ear__corner"></span>
  </span>
  <span class="cb-dog-ear__label">Mark as read</span>
</label>
</body></html>
