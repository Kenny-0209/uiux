<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartbeat loader</title><link rel="stylesheet" href="loader-heartbeat.css">

</head><body><div class="loader-heartbeat" role="status" aria-label="Loading">

    <path class="loader-heartbeat__head" pathLength="100" d="M0 22H32L35 15L39 30L44 5L49 34L53 22H100" />
  </svg>
  <span class="loader-heartbeat__dot" aria-hidden="true"></span>
</div>
</body></html>
