<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dial radio button</title><link rel="stylesheet" href="radio-dial.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-dial" role="radiogroup" aria-label="Fan speed">
  <label class="radio-dial__option" style="--radio-dial-a: -90deg">
    <input class="radio-dial__input" type="radio" name="radio-dial" value="Off">
    <span class="radio-dial__label">Off</span>
  </label>
  <label class="radio-dial__option" style="--radio-dial-a: -45deg">
    <input class="radio-dial__input" type="radio" name="radio-dial" value="Low">
    <span class="radio-dial__label">Low</span>
  </label>
  <label class="radio-dial__option" style="--radio-dial-a: 0deg">
    <input class="radio-dial__input" type="radio" name="radio-dial" value="Mid" checked>
    <span class="radio-dial__label">Mid</span>
  </label>
  <label class="radio-dial__option" style="--radio-dial-a: 45deg">
    <input class="radio-dial__input" type="radio" name="radio-dial" value="High">
    <span class="radio-dial__label">High</span>
  </label>
  <label class="radio-dial__option" style="--radio-dial-a: 90deg">
    <input class="radio-dial__input" type="radio" name="radio-dial" value="Max">
    <span class="radio-dial__label">Max</span>
  </label>
  <span class="radio-dial__knob" aria-hidden="true"></span>
</div>
</body></html>
