<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitch card</title><link rel="stylesheet" href="card-glitch.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-glitch">
  <div class="card-glitch__layer">
    <div class="card-glitch__media"><span class="card-glitch__mark"></span></div>
    <div class="card-glitch__body">
      <div class="card-glitch__title">GLITCH</div>
      <div class="card-glitch__text">Hover to corrupt</div>
    </div>
  </div>
  <!-- Two copies of the same card, sliced and offset on hover. -->
  <div class="card-glitch__layer card-glitch__layer--a" aria-hidden="true">
    <div class="card-glitch__media"><span class="card-glitch__mark"></span></div>
    <div class="card-glitch__body">
      <div class="card-glitch__title">GLITCH</div>
      <div class="card-glitch__text">Hover to corrupt</div>
    </div>
  </div>
  <div class="card-glitch__layer card-glitch__layer--b" aria-hidden="true">
    <div class="card-glitch__media"><span class="card-glitch__mark"></span></div>
    <div class="card-glitch__body">
      <div class="card-glitch__title">GLITCH</div>
      <div class="card-glitch__text">Hover to corrupt</div>
    </div>
  </div>
</div>
</body></html>
