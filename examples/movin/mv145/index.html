<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Shift input</title><link rel="stylesheet" href="input-icon-shift.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="field-icon-shift">
  <svg class="field-icon-shift__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <circle cx="6.5" cy="6.5" r="4" stroke-width="1.5" />
    <line x1="9.5" y1="9.5" x2="13" y2="13" stroke-width="1.5" stroke-linecap="round" />
  </svg>
  <input class="field-icon-shift__input" type="text" placeholder="Search…" aria-label="Search">
</label>
</body></html>
