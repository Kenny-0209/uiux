<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity radio button</title><link rel="stylesheet" href="radio-gravity.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-gravity" role="radiogroup" aria-label="Level">
  <label class="radio-gravity__option">
    <input class="radio-gravity__input" type="radio" name="radio-gravity" value="Apex">
    <span class="radio-gravity__socket"><span class="radio-gravity__ball"></span></span>
    <span class="radio-gravity__label">Apex</span>
  </label>
  <label class="radio-gravity__option">
    <input class="radio-gravity__input" type="radio" name="radio-gravity" value="Mid">
    <span class="radio-gravity__socket"><span class="radio-gravity__ball"></span></span>
    <span class="radio-gravity__label">Mid</span>
  </label>
  <label class="radio-gravity__option">
    <input class="radio-gravity__input" type="radio" name="radio-gravity" value="Base">
    <span class="radio-gravity__socket"><span class="radio-gravity__ball"></span></span>
    <span class="radio-gravity__label">Base</span>
  </label>
</div>
</body></html>
