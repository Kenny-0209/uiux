<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card radio button</title><link rel="stylesheet" href="radio-card.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-card" role="radiogroup" aria-label="Plan">
  <label class="radio-card__option">
    <input class="radio-card__input" type="radio" name="radio-card" value="basic">
    <span class="radio-card__text">
      <span class="radio-card__title">Basic</span>
      <span class="radio-card__sub">5 projects · 2 GB storage</span>
    </span>
    <span class="radio-card__ring"><span class="radio-card__dot"></span></span>
  </label>
  <label class="radio-card__option">
    <input class="radio-card__input" type="radio" name="radio-card" value="pro">
    <span class="radio-card__text">
      <span class="radio-card__title">Pro</span>
      <span class="radio-card__sub">Unlimited projects · 50 GB</span>
    </span>
    <span class="radio-card__ring"><span class="radio-card__dot"></span></span>
  </label>
  <label class="radio-card__option">
    <input class="radio-card__input" type="radio" name="radio-card" value="team">
    <span class="radio-card__text">
      <span class="radio-card__title">Team</span>
      <span class="radio-card__sub">Everything in Pro · SSO</span>
    </span>
    <span class="radio-card__ring"><span class="radio-card__dot"></span></span>
  </label>
</div>
</body></html>
