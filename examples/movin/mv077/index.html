<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typewriter card</title><link rel="stylesheet" href="card-typewriter.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-typewriter" data-hover-title="Activated" data-hover-text="It works!">
  <div class="card-typewriter__media">
    <span>&gt; run</span><span class="card-typewriter__cursor">_</span>
  </div>
  <div class="card-typewriter__body">
    <div class="card-typewriter__title"><span>Typewriter</span><span class="card-typewriter__caret card-typewriter__cursor">|</span></div>
    <div class="card-typewriter__text">Text types on hover</div>
  </div>
</div>
<script src="card-typewriter.js"></script></body></html>
