<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validate input</title><link rel="stylesheet" href="input-validate.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><form class="field-validate" novalidate>
  <div class="field-validate__box">
    <input class="field-validate__input" type="email" placeholder="you@example.com" aria-label="Email address">
    <span class="field-validate__icon" aria-hidden="true"></span>
  </div>
  <button class="field-validate__submit" type="submit">Submit</button>
</form>
<script src="input-validate.js"></script></body></html>
