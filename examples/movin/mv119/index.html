<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp checkbox</title><link rel="stylesheet" href="checkbox-stamp.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-stamp">
  <input class="cb-stamp__input" type="checkbox" aria-label="Remember me">
  <span class="cb-stamp__box" aria-hidden="true">
    <span class="cb-stamp__ink"></span>
    <span class="cb-stamp__ink"></span>
    <span class="cb-stamp__ink"></span>
    <span class="cb-stamp__ink"></span>
    <span class="cb-stamp__ink"></span>
    <span class="cb-stamp__ink"></span>
    <svg class="cb-stamp__check" width="14" height="11" viewBox="0 0 13 10" fill="none"><path d="M1.5 5L5 8.5L11.5 1.5" stroke="light-dark(#5f626a, #a7abb2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
  </span>
</label>
<script src="checkbox-stamp.js"></script></body></html>
