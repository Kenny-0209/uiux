<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smooth Caret input</title><link rel="stylesheet" href="input-caret.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="field-caret">
  <span class="field-caret__name">Display name</span>
  <span class="field-caret__box">
    <input class="field-caret__input" type="text" value="Smooth operator" spellcheck="false" autocomplete="off">
    <span class="field-caret__tail" aria-hidden="true"></span>
    <span class="field-caret__head" aria-hidden="true"></span>
  </span>
</label>
<script src="input-caret.js"></script></body></html>
