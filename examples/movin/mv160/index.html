<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split input</title><link rel="stylesheet" href="input-split.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="field-split">
  <span class="field-split__door field-split__door--left" aria-hidden="true"></span>
  <span class="field-split__door field-split__door--right" aria-hidden="true"></span>
  <input class="field-split__input" type="text" placeholder="Click to open…" aria-label="Your text">
</div>
</body></html>
