<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring radio button</title><link rel="stylesheet" href="radio-spring.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-spring" role="radiogroup" aria-label="Options">
  <label class="radio-spring__option">
    <input class="radio-spring__input" type="radio" name="radio-spring" value="Option A">
    <span class="radio-spring__ring"><span class="radio-spring__dot"></span></span>
    <span class="radio-spring__label">Option A</span>
  </label>
  <label class="radio-spring__option">
    <input class="radio-spring__input" type="radio" name="radio-spring" value="Option B">
    <span class="radio-spring__ring"><span class="radio-spring__dot"></span></span>
    <span class="radio-spring__label">Option B</span>
  </label>
  <label class="radio-spring__option">
    <input class="radio-spring__input" type="radio" name="radio-spring" value="Option C">
    <span class="radio-spring__ring"><span class="radio-spring__dot"></span></span>
    <span class="radio-spring__label">Option C</span>
  </label>
</div>
</body></html>
