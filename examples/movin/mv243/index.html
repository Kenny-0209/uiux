<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape radio button</title><link rel="stylesheet" href="radio-shape.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-shape">
  <span class="radio-shape__preview" aria-hidden="true"></span>
  <div class="radio-shape__row" role="radiogroup" aria-label="Shape">
    <label class="radio-shape__option">
      <input class="radio-shape__input" type="radio" name="radio-shape" value="circle" aria-label="Circle" checked>
      <svg class="radio-shape__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /></svg>
    </label>
    <label class="radio-shape__option">
      <input class="radio-shape__input" type="radio" name="radio-shape" value="square" aria-label="Square">
      <svg class="radio-shape__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="1" /></svg>
    </label>
    <label class="radio-shape__option">
      <input class="radio-shape__input" type="radio" name="radio-shape" value="triangle" aria-label="Triangle">
      <svg class="radio-shape__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 20 19H4Z" /></svg>
    </label>
    <label class="radio-shape__option">
      <input class="radio-shape__input" type="radio" name="radio-shape" value="star" aria-label="Star">
      <svg class="radio-shape__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.5 5.2 5.6.7-4.1 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.7Z" /></svg>
    </label>
  </div>
</div>
</body></html>
