<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural radio button</title><link rel="stylesheet" href="radio-neural.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="radio-neural" role="radiogroup" aria-label="Region">
  <label class="radio-neural__option">
    <input class="radio-neural__input" type="radio" name="radio-neural" value="Synapse" checked>
    <span class="radio-neural__web">
      <svg class="radio-neural__links" width="40" height="40" viewBox="0 0 40 40"><line x1="20" y1="20" x2="20" y2="6" /><line x1="20" y1="20" x2="32" y2="13" /><line x1="20" y1="20" x2="32" y2="27" /><line x1="20" y1="20" x2="20" y2="34" /><line x1="20" y1="20" x2="8" y2="27" /><line x1="20" y1="20" x2="8" y2="13" /></svg>
      <span class="radio-neural__node" style="left: 17.5px; top: 3.5px"></span><span class="radio-neural__node" style="left: 29.5px; top: 10.5px"></span><span class="radio-neural__node" style="left: 29.5px; top: 24.5px"></span><span class="radio-neural__node" style="left: 17.5px; top: 31.5px"></span><span class="radio-neural__node" style="left: 5.5px; top: 24.5px"></span><span class="radio-neural__node" style="left: 5.5px; top: 10.5px"></span>
      <span class="radio-neural__ring"><span class="radio-neural__dot"></span></span>
    </span>
    <span class="radio-neural__label">Synapse</span>
  </label>
  <label class="radio-neural__option">
    <input class="radio-neural__input" type="radio" name="radio-neural" value="Cortex">
    <span class="radio-neural__web">
      <svg class="radio-neural__links" width="40" height="40" viewBox="0 0 40 40"><line x1="20" y1="20" x2="20" y2="6" /><line x1="20" y1="20" x2="32" y2="13" /><line x1="20" y1="20" x2="32" y2="27" /><line x1="20" y1="20" x2="20" y2="34" /><line x1="20" y1="20" x2="8" y2="27" /><line x1="20" y1="20" x2="8" y2="13" /></svg>
      <span class="radio-neural__node" style="left: 17.5px; top: 3.5px"></span><span class="radio-neural__node" style="left: 29.5px; top: 10.5px"></span><span class="radio-neural__node" style="left: 29.5px; top: 24.5px"></span><span class="radio-neural__node" style="left: 17.5px; top: 31.5px"></span><span class="radio-neural__node" style="left: 5.5px; top: 24.5px"></span><span class="radio-neural__node" style="left: 5.5px; top: 10.5px"></span>
      <span class="radio-neural__ring"><span class="radio-neural__dot"></span></span>
    </span>
    <span class="radio-neural__label">Cortex</span>
  </label>
  <label class="radio-neural__option">
    <input class="radio-neural__input" type="radio" name="radio-neural" value="Axon">
    <span class="radio-neural__web">
      <svg class="radio-neural__links" width="40" height="40" viewBox="0 0 40 40"><line x1="20" y1="20" x2="20" y2="6" /><line x1="20" y1="20" x2="32" y2="13" /><line x1="20" y1="20" x2="32" y2="27" /><line x1="20" y1="20" x2="20" y2="34" /><line x1="20" y1="20" x2="8" y2="27" /><line x1="20" y1="20" x2="8" y2="13" /></svg>
      <span class="radio-neural__node" style="left: 17.5px; top: 3.5px"></span><span class="radio-neural__node" style="left: 29.5px; top: 10.5px"></span><span class="radio-neural__node" style="left: 29.5px; top: 24.5px"></span><span class="radio-neural__node" style="left: 17.5px; top: 31.5px"></span><span class="radio-neural__node" style="left: 5.5px; top: 24.5px"></span><span class="radio-neural__node" style="left: 5.5px; top: 10.5px"></span>
      <span class="radio-neural__ring"><span class="radio-neural__dot"></span></span>
    </span>
    <span class="radio-neural__label">Axon</span>
  </label>
</div>
</body></html>
