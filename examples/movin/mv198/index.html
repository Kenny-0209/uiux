<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segment loader</title><link rel="stylesheet" href="loader-segment.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="loader-segment" role="status" aria-label="Loading">
  <span class="loader-segment__seg loader-segment__seg--a" aria-hidden="true"></span>
  <span class="loader-segment__seg loader-segment__seg--b" aria-hidden="true"></span>
  <span class="loader-segment__seg loader-segment__seg--c" aria-hidden="true"></span>
  <span class="loader-segment__seg loader-segment__seg--d" aria-hidden="true"></span>
  <span class="loader-segment__seg loader-segment__seg--e" aria-hidden="true"></span>
  <span class="loader-segment__seg loader-segment__seg--f" aria-hidden="true"></span>
  <span class="loader-segment__seg loader-segment__seg--g" aria-hidden="true"></span>
</div>
</body></html>
