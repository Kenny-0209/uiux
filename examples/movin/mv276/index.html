<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padlock toggle</title><link rel="stylesheet" href="toggle-padlock.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="toggle-padlock">
  <input class="toggle-padlock__input" type="checkbox" role="switch">
  <span class="toggle-padlock__track" aria-hidden="true">
    <span class="toggle-padlock__thumb">
      <svg viewBox="0 0 24 24"><path class="toggle-padlock__shackle" d="M8 11V8a4 4 0 0 1 8 0v3" /><rect class="toggle-padlock__body" x="5.5" y="10.5" width="13" height="10" rx="2.5" /></svg>
    </span>
  </span>
  <span class="toggle-padlock__label">Lock settings</span>
</label>
</body></html>
