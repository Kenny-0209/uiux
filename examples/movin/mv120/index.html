<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch checkbox</title><link rel="stylesheet" href="checkbox-stitch.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><label class="cb-stitch">
  <input class="cb-stitch__input" type="checkbox">
  <span class="cb-stitch__patch" aria-hidden="true">
    <svg viewBox="0 0 32 32">
      <line class="cb-stitch__st" style="--cb-stitch-i: 0" x1="8.3" y1="16.8" x2="10.1" y2="18.6" />
      <line class="cb-stitch__st" style="--cb-stitch-i: 1" x1="11.3" y1="19.8" x2="13.1" y2="21.6" />
      <line class="cb-stitch__st" style="--cb-stitch-i: 2" x1="14.2" y1="21.2" x2="15.9" y2="19.3" />
      <line class="cb-stitch__st" style="--cb-stitch-i: 3" x1="16.9" y1="18.1" x2="18.7" y2="16.1" />
      <line class="cb-stitch__st" style="--cb-stitch-i: 4" x1="19.7" y1="14.9" x2="21.4" y2="13.0" />
    </svg>
    <span class="cb-stitch__needle"></span>
  </span>
  <span class="cb-stitch__label">Sewn in</span>
</label>
</body></html>
