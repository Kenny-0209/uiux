<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama card</title><link rel="stylesheet" href="card-diorama.css">
<style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f6;color:#222;font:15px system-ui,sans-serif;overflow:auto}</style>
</head><body><div class="card-diorama" tabindex="0">
  <div class="card-diorama__card">
    <div class="card-diorama__layer card-diorama__layer--sky" aria-hidden="true"><span class="card-diorama__sun"></span></div>
    <div class="card-diorama__layer card-diorama__layer--far" aria-hidden="true"><span class="card-diorama__shape"></span></div>
    <div class="card-diorama__layer card-diorama__layer--near" aria-hidden="true"><span class="card-diorama__shape"></span></div>
    <div class="card-diorama__layer card-diorama__layer--frame">
      <span class="card-diorama__title">Highlands</span>
      <span class="card-diorama__text">Four layers deep</span>
    </div>
  </div>
</div>
<script src="card-diorama.js"></script></body></html>
